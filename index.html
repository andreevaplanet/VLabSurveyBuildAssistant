  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html><head>\n<title>VLab Survey Build Assistant<\u002Ftitle>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"524014a7-6f64-403d-9237-dcf4985d3491\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<meta charset=\"utf-8\">\n<style>\nbody{margin:0;background:#EEF2F6;font-family:Arial,Helvetica,sans-serif}\n@media (max-width:1000px){\n  #shell{grid-template-columns:1fr !important}#navtab{display:none !important}\n  #sidebar{border-right:0 !important;border-bottom:1px solid #D6DCE4 !important;max-height:200px;overflow-y:auto}\n  #pane{padding:20px 18px 104px !important}\n  #navtab{left:auto !important;right:14px !important;top:auto !important;bottom:16px !important;\n    transform:none !important;border-radius:6px !important;flex-direction:row !important;\n    padding:10px 14px !important;gap:8px !important}\n  #navtab span:last-child{writing-mode:horizontal-tb !important}\n}\n*{box-sizing:border-box}\nbutton{font-family:inherit;cursor:pointer;border:0}\ninput,textarea,select{font-family:inherit}\na{color:#005BAA;text-decoration:none}\na:hover{color:#00B5D5}\n::selection{background:#FAA61A;color:#fff}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n\n\n<div style=\"min-height:100vh;display:flex;flex-direction:column;background:#EEF2F6\">\n\n  <div style=\"background:#005BAA;color:#fff;padding:18px 30px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap\">\n    <div style=\"flex:1 1 460px;min-width:0;display:flex;align-items:center;gap:20px\">\n      <img src=\"dfbc31c5-7a1b-4c10-b3fe-5fb381401261\" alt=\"WMO–CGMS Virtual Laboratory\" style=\"height:64px;width:auto;flex:0 0 auto;display:block\">\n      <div style=\"width:1px;align-self:stretch;background:rgba(255,255,255,.28);flex:0 0 auto\"><\u002Fdiv>\n      <div style=\"min-width:0\">\n        <div style=\"font-size:11px;line-height:1.45;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#FAA61A;margin-bottom:7px\">{{ uKicker }}<\u002Fdiv>\n        <div style=\"font-size:20px;font-weight:700;line-height:1.3\">{{ uApp }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:16px;flex-wrap:wrap\">\n      <div style=\"display:flex;align-items:center;gap:7px\">\n        <span style=\"font-size:12px;color:#BBD4EA;white-space:nowrap\">{{ uLblPlat }}<\u002Fspan>\n        <sc-raw-select value=\"{{ platform }}\" sc-camel-on-change=\"{{ setPlatform }}\" aria-label=\"{{ uLblPlat }}\" style=\"background:#fff;color:#1F2937;font-size:13px;font-weight:700;padding:8px 10px;border-radius:5px;border:0\">\n          <option value=\"googleforms\">Google Forms<\u002Foption>\n          <option value=\"msforms\">Microsoft Forms<\u002Foption>\n          <option value=\"surveymonkey\">SurveyMonkey<\u002Foption>\n          <option value=\"limesurvey\">LimeSurvey<\u002Foption>\n          <option value=\"typeform\">Typeform<\u002Foption>\n          <option value=\"generic\">{{ uOptOther }}<\u002Foption>\n        <\u002Fsc-raw-select>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:7px\">\n        <span style=\"font-size:12px;color:#BBD4EA;white-space:nowrap\">{{ uLblLang }}<\u002Fspan>\n        <sc-raw-select value=\"{{ lang }}\" sc-camel-on-change=\"{{ setLang }}\" aria-label=\"{{ uLblLang }}\" style=\"background:#fff;color:#1F2937;font-size:13px;font-weight:700;padding:8px 10px;border-radius:5px;border:0\">\n          <sc-for list=\"{{ langOpts }}\" as=\"lo\" hint-placeholder-count=\"7\">\n            <option value=\"{{ lo.v }}\">{{ lo.n }}<\u002Foption>\n          <\u002Fsc-for>\n        <\u002Fsc-raw-select>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;height:5px;flex:0 0 auto\">\n    <div style=\"flex:1;background:#00B5D5\"><\u002Fdiv>\n    <div style=\"flex:1;background:#70BF54\"><\u002Fdiv>\n    <div style=\"flex:1;background:#FAA61A\"><\u002Fdiv>\n    <div style=\"flex:1;background:#005BAA\"><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"background:#fff;border-bottom:1px solid #D6DCE4;padding:12px 30px;display:flex;align-items:center;gap:18px;flex-wrap:wrap\">\n    <div style=\"flex:1;min-width:200px\">\n      <div style=\"height:8px;background:#E7ECF1;border-radius:4px;overflow:hidden\">\n        <div style=\"height:8px;background:#70BF54;border-radius:4px;width:{{ pctStr }};transition:width .25s ease\"><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <sc-if value=\"{{ showCounts }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"font-size:13px;color:#4B5563;white-space:nowrap\"><strong style=\"color:#005BAA\">{{ doneCount }}<\u002Fstrong> / {{ totalSteps }} {{ uDone }} · {{ qCountLabel }}<\u002Fdiv><\u002Fsc-if>\n    <button sc-camel-on-click=\"{{ reset }}\" style-hover=\"background:#E7ECF1\" style=\"background:transparent;color:#6B7280;font-size:12px;padding:6px 11px;border:1px solid #D6DCE4;border-radius:5px\">{{ uReset }}<\u002Fbutton>\n  <\u002Fdiv>\n\n  <div id=\"shell\" style=\"flex:1;display:grid;grid-template-columns:{{ shellCols }};align-items:start;position:relative\">\n\n    <button id=\"navtab\" sc-camel-on-click=\"{{ toggleNav }}\" aria-expanded=\"{{ navOpen }}\" title=\"{{ uNavToggle }}\" style=\"{{ navTabStyle }}\">\n      <span style=\"font-size:13px;line-height:1\">{{ navIcon }}<\u002Fspan>\n      <span style=\"writing-mode:vertical-rl;font-size:11px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase\">{{ uSteps }}<\u002Fspan>\n    <\u002Fbutton>\n\n\n    <div id=\"sidebar\" style=\"{{ sidebarStyle }}\">\n      <div style=\"font-size:10px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:#6B7280;padding:0 18px 8px\">{{ uSteps }}<\u002Fdiv>\n      <sc-for list=\"{{ nav }}\" as=\"item\" hint-placeholder-count=\"10\">\n        <div sc-camel-on-click=\"{{ item.go }}\" sc-camel-on-key-down=\"{{ item.key }}\" role=\"{{ item.role }}\" sc-camel-tab-index=\"{{ item.tab }}\" style=\"{{ item.style }}\">\n          <span style=\"{{ item.dotStyle }}\">{{ item.mark }}<\u002Fspan>\n          <span style=\"flex:1;line-height:1.35\">{{ item.label }}<\u002Fspan>\n          <span style=\"{{ item.tagStyle }}\">{{ item.tag }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <div id=\"pane\" style=\"{{ paneStyle }}\">\n\n      <!-- ══ TEMPLATE PICKER ══ -->\n      <sc-if value=\"{{ isPicker }}\" hint-placeholder-val=\"{{ true }}\">\n      <div>\n        <div style=\"font-size:11px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:#00B5D5;margin-bottom:6px\">{{ tplLib }}<\u002Fdiv>\n        <div style=\"font-size:23px;font-weight:700;color:#005BAA;line-height:1.25;margin-bottom:8px\">{{ tplPick }}<\u002Fdiv>\n        <div style=\"font-size:14px;color:#6B7280;line-height:1.5;margin-bottom:22px;max-width:80ch\">{{ tplLead }}<\u002Fdiv>\n        <div role=\"radiogroup\" aria-label=\"{{ tplPick }}\">\n        <sc-for list=\"{{ cards }}\" as=\"c\" hint-placeholder-count=\"2\">\n          <div role=\"radio\" sc-camel-tab-index=\"0\" aria-checked=\"{{ c.on }}\" sc-camel-on-click=\"{{ c.pick }}\" sc-camel-on-key-down=\"{{ c.key }}\" style=\"{{ c.style }}\" style-hover=\"border-color:#005BAA\" style-focus=\"outline:3px solid #FAA61A;outline-offset:2px\">\n            <span style=\"{{ c.badgeStyle }}\">{{ c.badge }}<\u002Fspan>\n            <span style=\"flex:1\">\n              <strong style=\"font-size:17px;color:#005BAA;display:block;margin-bottom:5px\">{{ c.name }}<\u002Fstrong>\n              <span style=\"font-size:14px;color:#4B5563;line-height:1.45\">{{ c.when }}<\u002Fspan>\n            <\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ══ SETUP ══ -->\n      <sc-if value=\"{{ isSetup }}\" hint-placeholder-val=\"{{ true }}\">\n      <div>\n        <div style=\"font-size:11px;font-weight:700;letter-spacing:0.1em;text-transf :wrap\">\n                <div style=\"font-size:13px;line-height:1.5;color:#4B5563;flex:1;min-width:220px\">{{ uExpLime }}<\u002Fdiv>\n                \n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ showDocx }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"margin-top:14px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap\">\n                <div style=\"font-size:13px;line-height:1.5;color:#4B5563;flex:1;min-width:220px\">{{ uExpDocx }}<\u002Fdiv>\n                \n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ showTf }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"margin-top:14px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap\">\n                <div style=\"font-size:13px;line-height:1.5;color:#4B5563;flex:1;min-width:220px\">{{ uExpJson }}<\u002Fdiv>\n                \n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ showSm }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"margin-top:14px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap\">\n                <div style=\"font-size:13px;line-height:1.5;color:#4B5563;flex:1;min-width:220px\">{{ uExpJson }}<\u002Fdiv>\n                \n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ gsHasPending }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"margin-top:10px;background:#FFF4E2;border-left:4px solid #FAA61A;padding:10px 14px;font-size:12.5px;line-height:1.5;color:#B06E00\">{{ uGsWarn }}<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        \n        <div style=\"background:#F2F6FA;border-left:4px solid #005BAA;padding:15px 19px;font-size:13.5px;line-height:1.55;color:#4B5563\">{{ uFinalNote }}<\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <div style=\"display:flex;align-items:center;gap:11px;margin-top:24px;padding-top:18px;border-top:1px solid #D6DCE4;flex-wrap:wrap\">\n        <button sc-camel-on-click=\"{{ prev }}\" disabled=\"{{ atStart }}\" style=\"{{ prevStyle }}\">← {{ uBack }}<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ next }}\" disabled=\"{{ atEnd }}\" style=\"{{ nextStyle }}\">{{ nextLabel }}<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"margin-top:14px;display:flex;align-items:baseline;justify-content:space-between;gap:20px;flex-wrap:wrap\">\n        <div style=\"font-size:12.5px;color:#9AA4B0\">{{ uKeys }}<\u002Fdiv>\n        <div style=\"font-size:12px;color:#9AA4B0;white-space:nowrap\">{{ uCredit }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:880}}\">\n/* ── Platform-specific type names and caveats ───────────────────────────── */\nconst PLATFORMS = {\n  googleforms: { name:'Google Forms',\n    types:{ single:'Multiple choice', dropdown:'Dropdown',\n      multi:'Checkboxes', nps:'Linear scale, 0 to 10',\n      grid:'Multiple-choice grid', short:'Short answer', long:'Paragraph',\n      email:'Short answer, with response validation set to Email' },\n    grid:'Use a Multiple-choice grid. Rows are your statements; columns are the scale.',\n    caveats:[\n      {h:'Supports the specification without compromise', t:'Google Forms offers a true 0–10 linear scale, multiple-choice grids, and per-question branching. Nothing in the core needs adapting, and a \"Not applicable\" column can be added to any grid as an extra column.'},\n      {h:'Branching is set on the question', t:'Open the three-dot menu on the follow-up consent question and choose \"Go to section based on answer\". Yes goes to the contact section; No goes to \"Submit form\".'},\n      {h:'Check the response settings explicitly', t:'Under Settings → Responses, leave \"Collect email addresses\" off and \"Limit to 1 response\" off. The second requires a Google sign-in and excludes participants whose institutions restrict external accounts.'}\n    ]},\n  msforms: { name:'Microsoft Forms',\n    types:{ single:'Choice, single answer', dropdown:'Choice — then enable \"Drop-down\" in the question \"...\" menu',\n      multi:'Choice, with \"Multiple answers\" enabled', nps:'Rating, 10 levels',\n      grid:'Likert', short:'Text, short answer', long:'Text — enable \"Long answer\"',\n      email:'Text, with a restriction of Text → Email' },\n    grid:'Choose Add new → Likert. The scale goes in \"Options\" and the statements in \"Instructions\", one per line.',\n    caveats:[\n      {h:'Rating scales start at 1, not 0', t:'C5 loses its true zero. Either accept an offset scale and note it in your report, or add the eleven levels as explicit choice options (10 down to 1) to keep the wording of the endpoints. Whichever you pick, record it — a net promoter score computed on 1–10 is not comparable with one computed on 0–10 unless the difference is stated.'},\n      {h:'Branching lives on the section, not the question', t:'Open the follow-up section → \"...\" → Branching, and set the two outcomes there. Setting it on the question itself is not possible.'},\n      {h:'Likert has no per-row \"not applicable\"', t:'Add it as an extra column instead — the core wording already assumes this.'}\n    ]},\n  surveymonkey: { name:'SurveyMonkey',\n    types:{ single:'Multiple Choice, one answer', dropdown:'Dropdown',\n      multi:'Multiple Choice, allow multiple answers', nps:'Net Promoter® Score question type',\n      grid:'Matrix / Rating Scale', short:'Single Textbox', long:'Comment Box',\n      email:'Single Textbox, with email validation' },\n    grid:'Use Matrix / Rating Scale. Rows are your statements; columns are the scale.',\n    caveats:[\n      {h:'Use the native NPS question for C5', t:'SurveyMonkey has a purpose-built Net Promoter Score question on a true 0–10 scale. Use it rather than a generic rating — it gives you the correct scale and computes the score for you.'},\n      {h:'Skip logic is per question', t:'Set it on the follow-up consent question: one answer continues to the contact page, the other jumps to the end of the survey.'},\n      {h:'Check your plan for matrix questions', t:'Matrix questions and skip logic are not on every plan tier. If unavailable, split each grid into separate single-choice questions using the same scale — the indicators still compute, but the survey grows by several questions.'}\n    ]},\n  limesurvey: { name:'LimeSurvey',\n    types:{ single:'List (radio)', dropdown:'List (dropdown)',\n      multi:'Multiple choice', nps:'Numerical input, or a 0–10 array',\n      grid:'Array', short:'Short free text', long:'Long free text',\n      email:'Short free text, with an email validation regex' },\n    grid:'Use an Array question. Subquestions are your statements; answer options are the scale.',\n    caveats:[\n      {h:'Supports the specification without compromise', t:'LimeSurvey supports a genuine 0–10 scale, arrays with a \"not applicable\" column, and per-question conditions. Nothing in the core needs adapting.'},\n      {h:'Set anonymous responses explicitly', t:'Survey settings → Participant settings → Anonymised responses: Yes. Otherwise token-based invitations can link answers to individuals, which contradicts the confidentiality statement you have just published.'},\n      {h:'Self-hosting is an advantage here', t:'For Centres whose institutions restrict external data processing, a self-hosted LimeSurvey keeps responses entirely inside the institution. Worth flagging to your data-protection officer as the low-friction option.'}\n    ]},\n  typeform: { name:'Typeform',\n    types:{ single:'Multiple Choice', dropdown:'Dropdown',\n      multi:'Multiple Choice, multiple selection allowed', nps:'Opinion Scale, 0 to 10, or the NPS block',\n      grid:'Matrix — or split into separate Opinion Scale questions',\n      short:'Short Text', long:'Long Text', email:'Email' },\n    grid:'Matrix is available on higher plans. If you do not have it, split the grid into separate Opinion Scale questions sharing one scale.',\n    caveats:[\n      {h:'One question per screen changes the feel', t:'Typeform shows questions one at a time. A 17-question survey therefore feels longer than the same survey in a paged tool, even though it is not. Tell participants the number of questions up front to offset this.'},\n      {h:'Matrix may not be on your plan', t:'Without it, the four grid questions become roughly eighteen separate questions. That is a real cost — consider whether another tool serves you better for this instrument.'},\n      {h:'Opinion Scale does support 0–10', t:'Good news for C5: set the range to 0–10 and label the endpoints. The net promoter score stays comparable across the network.'}\n    ]},\n  generic: { name:'your chosen tool',\n    types:{ single:'Single-choice question', dropdown:'Dropdown or single-choice list',\n      multi:'Multiple-selection question', nps:'0 to 10 numeric scale',\n      grid:'Grid, matrix or array question', short:'Short text field', long:'Long text field',\n      email:'Short text field, validated as an email address' },\n    grid:'Rows are the statements, columns are the scale. If your tool has no grid type, split into separate questions sharing one scale.',\n    caveats:[\n      {h:'Three things to preserve above all', t:'A true 0–10 range on C5; identical rows and scale on C7 and C8, since the learning-gain indicator is the difference between them; and a single branch on the consent question. Everything else can bend.'},\n      {h:'Anonymity is a setting, not an intention', t:'Whatever tool you use, verify that it is not recording names, IP addresses or logins against responses. You have promised confidentiality in the introduction.'},\n      {h:'Paper works', t:'For activities with poor connectivity, this instrument works on paper. Print it, collect it at the close of the final session — response rates are typically far higher than online — and enter the results into a spreadsheet.'}\n    ]}\n};\n\n/* ── The instrument ─────────────────────────────────────────────────────── */\nconst TXT = {\n  en: {\n    formTitle: 'Course evaluation: {title}',\n    desc: 'Thank you for taking part in the training course “{course}”, delivered {dates} by {org} — {centre}, under the WMO–CGMS Virtual Laboratory for Education and Training in Satellite Meteorology.\\n\\nThis questionnaire takes about {mins} minutes. Your answers help us improve future training and allow us to report the reach and results of this activity to the WMO–CGMS VLab.\\n\\nResponses are treated confidentially. Results are reported only in aggregate and no individual response is attributed. Giving your email address is optional and is used solely to send a short follow-up survey after an interval; it is never linked to your answers in any published result.\\n\\nThere are no right or wrong answers — candid criticism is more useful to us than praise.\\n\\nPlease respond by {deadline}.',\n    thanks: 'Thank you. Your evaluation directly shapes the planning of future VLab activities, and the main findings will be shared with participants.',\n    s:['1. About you','2. Your overall assessment','3. Delivery and materials','4. Knowledge and skills','5. Application and your comments','6. Follow-up','7. Contact'],\n    agreeCols:['Strongly disagree','Disagree','Neither agree nor disagree','Agree','Strongly agree'],\n    agreeRows:['The content was relevant to my work or studies','The level of difficulty was right for me','The activity was well organized and well communicated','I had enough opportunity to ask questions and interact','The activity met the expectations set in the announcement'],\n    abilityCols:['None','Basic','Intermediate','Advanced','Could teach others'],\n    qualityCols:['Poor','Fair','Good','Very good','Excellent'],\n    components:['The instructors’ explanations','The live demonstrations','The hands-on exercises','The supporting materials and documentation']\n  },\n  pt: {\n    formTitle: 'Avaliação da atividade: {title}',\n    desc: 'Agradecemos sua participação na atividade “{course}”, realizado {dates} por {org} — {centre}, no âmbito do Laboratório Virtual OMM–CGMS para Educação e Formação em Meteorologia por Satélite.\\n\\nEste questionário leva cerca de {mins} minutos. Suas respostas nos ajudam a aprimorar as próximas atividades e nos permitem mostrar ao VLab OMM–CGMS quem esta atividade alcançou e o que resultou dela.\\n\\nAs respostas são tratadas com confidencialidade. Os resultados são divulgados apenas de forma agregada, e nenhuma resposta é identificada individualmente. Informar seu e-mail é opcional: ele serve apenas para enviarmos, mais adiante, um breve questionário de acompanhamento, e nunca é vinculado às suas respostas em nenhum resultado publicado.\\n\\nNão há respostas certas ou erradas — uma crítica sincera nos é mais útil do que um elogio.\\n\\nPedimos que responda até {deadline}.',\n    thanks: 'Agradecemos. Sua avaliação orienta diretamente o planejamento das próximas atividades da rede VLab, e as principais conclusões serão compartilhadas com os participantes.',\n    s:['1. Sobre você','2. Sua avaliação geral','3. Condução e materiais','4. Conhecimentos e habilidades','5. Aplicação e seus comentários','6. Acompanhamento','7. Contato'],\n    agreeCols:['Discordo totalmente','Discordo','Nem concordo nem discordo','Concordo','Concordo totalmente'],\n    agreeRows:['O conteúdo foi relevante para meu trabalho ou meus estudos','O nível de dificuldade foi adequado para mim','A atividade foi bem organizada e as informações foram claras','Tive oportunidades suficientes de fazer perguntas e interagir','A atividade correspondeu às expectativas criadas pela divulgação'],\n    abilityCols:['Ainda não tenho','Nível básico','Nível intermediário','Nível avançado','Poderia ensinar outras pessoas'],\n    qualityCols:['Insuficiente','Regular','Bom','Muito bom','Excelente'],\n    components:['As explicações dos instrutores','As demonstrações ao vivo','Os exercícios práticos','Os materiais de apoio e a documentação']\n  },\n  fr: {\n    formTitle: 'Évaluation de l’activité : {title}',\n    desc: 'Nous vous remercions d’avoir participé à l’activité de formation « {course} », organisée {dates} par {org} — {centre}, dans le cadre du Laboratoire virtuel OMM–CGMS pour l’enseignement et la formation en météorologie satellitaire.\\n\\nCe questionnaire prend environ {mins} minutes. Vos réponses nous aident à améliorer les prochaines activités et de montrer au Laboratoire virtuel OMM–CGMS qui cette activité a touché et ce qu’elle a produit.\\n\\nLes réponses sont traitées de manière confidentielle. Les résultats ne sont présentés que sous forme agrégée et aucune réponse n’est rattachée à son auteur. Indiquer votre adresse électronique est facultatif et sert uniquement à l’envoi d’une brève enquête de suivi après un certain délai ; elle n’est jamais associée à vos réponses dans aucun résultat publié.\\n\\nIl n’y a pas de bonne ou de mauvaise réponse — une critique franche nous est plus utile que des éloges.\\n\\nMerci de répondre avant le {deadline}.',\n    thanks: 'Merci. Votre évaluation oriente directement la planification des prochaines activités du Laboratoire virtuel, et les principaux enseignements seront communiqués aux participants.',\n    s:['1. À propos de vous','2. Votre appréciation générale','3. Animation et supports','4. Connaissances et compétences','5. Application et vos commentaires','6. Suivi','7. Contact'],\n    agreeCols:['Pas du tout d’accord','Plutôt pas d’accord','Ni d’accord ni pas d’accord','Plutôt d’accord','Tout à fait d’accord'],\n    agreeRows:['Le contenu était pertinent pour mon travail ou mes études','Le niveau de difficulté me convenait','L’activité était bien organisée et la communication a été claire','J’ai eu suffisamment d’occasions de poser des questions et d’échanger','L’activité a répondu aux attentes annoncées'],\n    abilityCols:['Aucune pour l’instant','Niveau élémentaire','Niveau intermédiaire','Niveau avancé','Je pourrais l’enseigner'],\n    qualityCols:['Insuffisant','Passable','Bon','Très bon','Excellent'],\n    components:['Les explications des formateurs','Les démonstrations en direct','Les exercices pratiques','Les supports et la documentation']\n  },\n  es: {\n    formTitle: 'Evaluación de la actividad: {title}',\n    desc: 'Le agradecemos su participación en la actividad de formación «{course}», impartido {dates} por {org} — {centre}, en el marco del Laboratorio Virtual OMM–CGMS para la Enseñanza y la Formación en Meteorología Satelital.\\n\\nEste cuestionario lleva unos {mins} minutos. Sus respuestas nos ayudan a mejorar las próximas actividades de formación y nos permiten mostrar al Laboratorio Virtual OMM–CGMS a quiénes llegó esta actividad y qué resultó de ella.\\n\\nLas respuestas se tratan de forma confidencial. Los resultados se presentan únicamente de forma agregada y ninguna respuesta se identifica de forma individual. Facilitar su correo electrónico es opcional: solo lo utilizamos para enviarle más adelante una breve encuesta de seguimiento, y nunca se vincula a sus respuestas en ningún resultado publicado.\\n\\nNo hay respuestas correctas ni incorrectas: una crítica sincera nos resulta más útil que los elogios.\\n\\nLe rogamos que responda antes del {deadline}.',\n    thanks: 'Gracias. Su evaluación orienta directamente la planificación de las próximas actividades del Laboratorio Virtual, y las principales conclusiones se compartirán con los participantes.',\n    s:['1. Sobre usted','2. Su valoración general','3. Impartición y materiales','4. Conocimientos y competencias','5. Aplicación y sus comentarios','6. Seguimiento','7. Contacto'],\n    agreeCols:['Totalmente en desacuerdo','En desacuerdo','Ni de acuerdo ni en desacuerdo','De acuerdo','Totalmente de acuerdo'],\n    agreeRows:['El contenido fue pertinente para mi trabajo o mis estudios','El nivel de dificultad fue adecuado para mí','La actividad estuvo bien organizada y la comunicación fue clara','Tuve suficientes oportunidades de preguntar e interactuar','La actividad respondió a las expectativas creadas en el anuncio'],\n    abilityCols:['Ninguna todavía','Nivel básico','Nivel intermedio','Nivel avanzado','Podría enseñar a otras personas'],\n    qualityCols:['Insuficiente','Regular','Bueno','Muy bueno','Excelente'],\n    components:['Las explicaciones de los instructores','Las demostraciones en directo','Los ejercicios prácticos','Los materiales de apoyo y la documentación']\n  },\n  ru: {\n    formTitle: 'Оценка мероприятия: {title}',\n    desc: 'Благодарим вас за участие в мероприятии «{course}», которое {dates} провела организация {org} — {centre} в рамках Виртуальной лаборатории ВМО–КГМС по образованию и подготовке кадров в области спутниковой метеорологии.\\n\\nАнкета займёт около {mins} минут. Ваши ответы помогут нам улучшить последующие учебные мероприятия, а также показать Виртуальной лаборатории ВМО–КГМС, кого охватило это мероприятие и какие результаты оно принесло.\\n\\nОтветы обрабатываются конфиденциально: результаты публикуются только в обобщённом виде, без указания авторства. Адрес электронной почты указывать необязательно — он понадобится лишь для короткого повторного опроса спустя некоторое время и никогда не сопоставляется с вашими ответами в публикуемых материалах.\\n\\nЗдесь нет правильных и неправильных ответов: откровенная критика для нас полезнее похвалы.\\n\\nОтветы принимаются до {deadline}.',\n    thanks: 'Спасибо! Ваша оценка напрямую влияет на то, какими будут следующие мероприятия Виртуальной лаборатории. Основные выводы мы направим участникам.',\n    s:['1. О вас','2. Общая оценка','3. Проведение и материалы','4. Знания и навыки','5. Применение и ваши комментарии','6. Повторный опрос','7. Контактные данные'],\n    agreeCols:['Совершенно не согласны','Скорее не согласны','Затрудняюсь ответить','Скорее согласны','Полностью согласны'],\n    agreeRows:['Содержание было актуально для моей работы или учёбы','Уровень сложности мне подходил','Мероприятие было хорошо организовано, всё было понятно заранее','Мне хватало возможностей задавать вопросы и участвовать в обсуждении','Мероприятие соответствовало тому, что было анонсировано'],\n    abilityCols:['Навыков нет','Базовый уровень','Средний уровень','Уверенный уровень','Могу научить других'],\n    qualityCols:['Неудовлетворительно','Удовлетворительно','Хорошо','Очень хорошо','Отлично'],\n    components:['Объяснения преподавателей','Демонстрации в прямом эфире','Практические задания','Раздаточные материалы и документация']\n  },\n  zh: {\n    formTitle: '活动评估：{title}',\n    desc: '感谢您参加培训活动《{course}》。本次活动于 {dates} 由 {org} — {centre} 主办，属于世界气象组织–气象卫星协调组卫星气象教育与培训虚拟实验室（WMO–CGMS VLab）的活动。\\n\\n本问卷约需 {mins} 分钟。您的回答有助于我们改进今后的培训，并使我们能够向 WMO–CGMS 虚拟实验室说明本次活动接触到了哪些人、带来了哪些实际成效。\\n\\n所有回答均予以保密。结果仅以汇总形式呈现，不会标注任何个人的回答。填写电子邮箱是自愿的，仅用于日后发送一份简短的跟进问卷；在任何公开发布的结果中，邮箱都不会与您的回答相关联。\\n\\n本问卷没有标准答案——坦率的批评对我们而言比赞扬更有价值。\\n\\n请于 {deadline} 前作答。',\n    thanks: '感谢您。您的评估将直接影响虚拟实验室今后活动的规划，主要结论也将与参加者分享。',\n    s:['1. 关于您','2. 总体评价','3. 授课与材料','4. 知识与技能','5. 应用与您的意见','6. 后续跟进','7. 联系方式'],\n    agreeCols:['非常不同意','不太同意','一般','比较同意','非常同意'],\n    agreeRows:['内容与我的工作或学习切实相关','难度对我而言适中','活动组织良好，信息传达清晰','我有足够的机会提问和参与互动','活动与事先通知的内容相符'],\n    abilityCols:['尚不具备','基础水平','中等水平','熟练水平','可以指导他人'],\n    qualityCols:['较差','一般','良好','很好','优秀'],\n    components:['授课教师的讲解','现场演示','实操练习','辅助材料与文档']\n  },\n  ar: {\n    formTitle: 'تقييم النشاط: {title}',\n    desc: 'نشكرك على مشاركتك في النشاط التدريبي «{course}»، الذي نُظِّم {dates} من قبل {org} — {centre}، في إطار المختبر الافتراضي WMO–CGMS للتعليم والتدريب في مجال الأرصاد الجوية الساتلية.\\n\\nيستغرق هذا الاستبيان نحو {mins} دقيقة. تساعدنا إجاباتك على تحسين الأنشطة المقبلة، وتتيح لنا أن نبيّن للمختبر الافتراضي WMO–CGMS من وصل إليه هذا النشاط وما أثمره.\\n\\nتُعامل الإجابات بسرية تامة. ولا تُعرض النتائج إلا بصورة مجمّعة، ولا تُنسب أي إجابة إلى صاحبها. وإدراج بريدك الإلكتروني اختياري، ويُستخدم حصرًا لإرسال استبيان متابعة قصير بعد فترة؛ ولا يُربط أبدًا بإجاباتك في أي نتيجة منشورة.\\n\\nلا توجد إجابات صحيحة أو خاطئة — فالنقد الصريح أنفع لنا من الثناء.\\n\\nنرجو الرد قبل {deadline}.',\n    thanks: 'شكرًا لك. يوجّه تقييمك مباشرةً التخطيط لأنشطة المختبر الافتراضي المقبلة، وستُشارَك أبرز الاستنتاجات مع المشاركين.',\n    s:['1. نبذة عنك','2. تقييمك العام','3. التقديم والمواد','4. المعارف والمهارات','5. التطبيق وملاحظاتك','6. المتابعة','7. بيانات الاتصال'],\n    agreeCols:['لا أوافق بشدة','لا أوافق','محايد','أوافق','أوافق بشدة'],\n    agreeRows:['كان المحتوى وثيق الصلة بعملي أو دراستي','كان مستوى الصعوبة مناسبًا لي','كان النشاط جيّد التنظيم وكانت المعلومات المتعلقة به واضحة','أُتيحت لي فرص كافية لطرح الأسئلة والتفاعل','جاء النشاط مطابقًا لما أُعلن عنه'],\n    abilityCols:['لا قدرة لديّ بعد','مستوى أساسي','مستوى متوسط','مستوى متقدّم','يمكنني تعليم الآخرين'],\n    qualityCols:['ضعيف','مقبول','جيد','جيد جدًا','ممتاز'],\n    components:['شروح المدرّبين','العروض التوضيحية المباشرة','التمارين التطبيقية','المواد الداعمة والوثائق']\n  }\n};\n\nconst Q = {\n  en: {\n    c1:{t:'Which country do you live and work in?',ty:'dropdown',o:['Your country list — keep \"Another country\" last']},\n    c2:{t:'What type of organization do you work for?',ty:'single',o:['A national meteorological or hydrological service','Another government agency','A university or research institute','I am a student, not yet working in the sector','A private-sector company','An NGO or international organization']},\n    c3:{t:'How many years have you worked in this field?',ty:'single',o:['None — this activity was my first exposure','Less than 1 year','1 to 3 years','4 to 10 years','More than 10 years']},\n    c4:{t:'Overall, how would you rate this activity?',ty:'single',o:['Excellent','Very good',' ательский институт','Учусь и пока не работаю в этой сфере','Частная компания','НПО или международная организация']},\n    c3:{t:'Как давно вы работаете в этой области?',ty:'single',o:['Пока не работаю — это мероприятие стало первым знакомством с темой','Менее 1 года','От 1 до 3 лет','От 4 до 10 лет','Более 10 лет']},\n    c4:{t:'Ваша общая оценка мероприятия',ty:'single',o:['Отлично','Очень хорошо','Хорошо','Удовлетворительно','Плохо']},\n    c5:{t:'Порекомендуете ли вы это мероприятие коллегам?',ty:'nps',n:'Подписи крайних значений: 0 — точно нет, 10 — обязательно порекомендую.'},\n    c6:{t:'Насколько вы согласны с каждым утверждением?',ty:'grid'},\n    c7:{t:'ДО мероприятия: как вы оценили бы свои навыки по каждому пункту?',ty:'grid',n:'В качестве строк используйте свои компетенции, в том же порядке, что и в следующем вопросе.'},\n    c8:{t:'СЕЙЧАС, после мероприятия: как вы оцениваете свои навыки по каждому пункту?',ty:'grid',n:'Строки и шкала полностью совпадают с предыдущим вопросом. Показатель прироста знаний — это разница между ними, поэтому любое расхождение в формулировках делает его непригодным.'},\n    c9:{t:'Насколько вы уверены, что сможете применить полученные знания без посторонней помощи?',ty:'single',o:['Полностью уверены','Скорее уверены','Уверены отчасти','Скорее не уверены','Совсем не уверены']},\n    c10:{t:'Собираетесь ли вы применить полученные знания в работе или учёбе в ближайшие три месяца?',ty:'single',o:['Определённо да','Скорее да','Затрудняюсь ответить','Скорее нет','Определённо нет']},\n    c11:{t:'Можно ли будет через некоторое время задать вам несколько вопросов о том, как вы применили полученные знания?',ty:'single',o:['Да, свяжитесь со мной','Нет, спасибо'],n:'Единственный вопрос с ветвлением. «Да» ведёт к разделу с контактными данными, «Нет» завершает анкету.'},\n    c12:{t:'Ваш адрес электронной почты',ty:'email',n:'Показывается только тем, кто ответил «Да» выше.'},\n    r1:{t:'Оцените, пожалуйста, каждый из перечисленных элементов',ty:'grid',n:'Удалите любую строку, которой не было в вашем мероприятии.'},\n    r2:{t:'Темп мероприятия показался вам',ty:'single',o:['Слишком медленным','Скорее медленным','В целом подходящим','Скорее быстрым','Слишком быстрым']},\n    r3:{t:'Что оказалось для вас самым полезным?',ty:'long',sub:'Необязательно, но пара фраз здесь для нас ценнее любой оценки по шкале.'},\n    r4:{t:'Что стоило бы изменить в первую очередь?',ty:'long',sub:'Необязательно. Критику мы правда ждём: именно она меняет следующее мероприятие.'},\n    r5:{t:'Какие темы вы хотели бы видеть в следующих мероприятиях?',ty:'multi',sub:'Не более пяти вариантов.',o:['Ваши возможные темы — от шести до двенадцати, только то, что вы действительно способны провести']},\n    mA1:{t:'Получилось ли у вас выполнить практические задания?',ty:'grid',n:'Строки — ваши практические среды, названные по инструменту, а не по заданию. Шкала: Все / Большинство / Только частично / Ни одного / Не пробовали.'},\n    mA2:{t:'Что помогло бы вам больше всего на практических занятиях?',ty:'single',o:['Проверка настроек заранее, чтобы убедиться, что всё работает','Второй преподаватель, который отвечает на вопросы в чате','Материалы с контрольными точками, чтобы можно было подключиться к любому разделу','Более спокойный темп с паузами, чтобы все успевали','Материалы для подготовки, присланные заранее','Ничего: практические занятия прошли для меня хорошо']},\n    mB1:{t:'Насколько полно вы участвовали в мероприятии?',ty:'single',o:['Все занятия в прямом эфире','Большая часть занятий в прямом эфире','Примерно половина занятий','Только вводное занятие','В основном записи']},\n    mB2:{t:'Если вы участвовали не во всём — что помешало?',ty:'multi',sub:'Не более трёх вариантов.',o:['Совпало с рабочими делами','Неудобное время для моего часового пояса','Слишком быстрый темп','Содержание оказалось сложнее ожидаемого','Содержание оказалось проще ожидаемого','Технические трудности или проблемы со связью','Решили посмотреть записи позже']},\n    mC1:{t:'Какая тема далась вам труднее всего?',ty:'single',o:['Ваш список занятий или тем в том виде, в каком он был в программе','Ни одна: всё далось без труда']},\n    mD1:{t:'Насколько полезным оказался каждый из перечисленных ресурсов?',ty:'grid',n:'Строки: чат в прямом эфире; инструмент вопросов и ответов; учебная платформа; записи; переписка с преподавателями по электронной почте. Шкала: Не использовали / Бесполезно / Полезно / Очень полезно.'},\n    mE1:{t:'Итоговая проверка знаний соответствовала содержанию мероприятия',ty:'single',o:['Совершенно не согласны','Скорее не согласны','Затрудняюсь ответить','Скорее согласны','Полностью согласны']},\n    mF1:{t:'Мешало ли вам что-нибудь из перечисленного?',ty:'multi',o:['Язык проведения','Часовой пояс занятий в прямом эфире','Скорость моего интернет-соединения','Доступ к программному обеспечению или лицензиям в моей организации','Особые потребности доступности, которые не были учтены','Ничего из перечисленного']},\n    mG1:{t:'Насколько удачным было соотношение самостоятельной работы и занятий в прямом эфире?',ty:'single',o:['Слишком много самостоятельной работы','Соотношение было удачным','Слишком много занятий в прямом эфире','Предпочли бы полностью самостоятельный формат','Предпочли бы только прямой эфир']},\n    mH1:{t:'Поддерживает ли вас организация в применении полученных знаний?',ty:'single',o:['Да, активно: у меня есть на это время и ресурсы','Да, в принципе, но без выделенного времени','Нет, но я всё равно буду применять','Нет, и это помешает мне применить знания','Пока не знаю']}\n  },\n  zh: {\n    c1:{t:'您在哪个国家生活和工作？',ty:'dropdown',o:['您的国家列表——请将“其他国家”置于最后']},\n    c2:{t:'您在何种类型的机构工作？',ty:'single',o:['国家气象或水文部门','其他政府机构','高校或研究院所','我是学生，尚未在本行业工作','私营企业','非政府组织或国际组织']},\n    c3:{t:'您在本领域工作了多少年？',ty:'single',o:['没有工作经验——本次活动是我第一次接触本领域','不满 1 年','1 至 3 年','4 至 10 年','10 年以上']},\n    c4:{t:'总体而言，您如何评价本次活动？',ty:'single',o:['优秀','很好','良好','一般','较差']},\n    c5:{t:'您向同事推荐本次活动的可能性有多大？',ty:'nps',n: , isDone:'Terminée ✓',\n  keys:'Flèches pour naviguer · C pour copier la question. La progression est enregistrée dans ce navigateur.',\n  submitLbl:'envoyer le formulaire', branchLbl:'Où mène chaque réponse',\n  contactLbl:'Champ de contact', stepOf:'Étape {i} sur {n}', finalKicker:'Dernière étape', qOf:'Question {i} sur {n}', module:'module',\n  setupTitle:'Décrivez votre activité',\n  setupLead:'Ces informations alimentent automatiquement les boutons de copie des étapes suivantes : vous collerez donc un texte prêt à l’emploi, sans champs à compléter. Aucune donnée n’est transmise ; tout reste dans votre navigateur.',\n  fTitle:'Intitulé de l’activité', fOrg:'Institution pilote', fCentre:'Centre d’excellence', fDates:'Dates de l’activité', fDeadline:'Date limite de réponse', fSubject:'Sujet de l’activité', phSubject:'ex. les données sur les feux de végétation', hintSubject:'Utilisé à la Q2 pour demander à quelle fréquence votre sujet intervient dans le travail du répondant. Rédigez-le comme il se lirait en milieu de phrase, en minuscules.',\n  phTitle:'ex. Suivi de la sécheresse par satellite', phOrg:'ex. votre institution', phCentre:'ex. Centre d’excellence du Laboratoire virtuel', phDates:'ex. du 3 au 5 mars 2027', phDeadline:'ex. 20 mars 2027',\n  uLOTitle:'Les acquis d’apprentissage', uLOLead:'Reprenez les acquis d’apprentissage de votre enquête immédiate, mot pour mot et dans le même ordre. La Q6 compare les deux : toute variation de formulation rompt la comparaison.',\n  compTitle:'Compétences — le seul point qu’il faut absolument réussir',\n  compLead:'Décrivez des actions concrètes que le participant peut s’imaginer accomplir. Des verbes d’action, non des noms de savoir. Une par ligne — ajoutez ou supprimez des lignes au besoin. Quatre est le nombre recommandé : au-delà, la grille devient plus difficile à remplir, et quatre suffisent pour détecter un gain d’apprentissage.',\n  compPh:'ex. une tâche concrète enseignée dans votre activité',\n  modTitle:'Modules facultatifs', modLead:'Trois modules au maximum. Le socle et les questions recommandées en comptent déjà 17, et chaque module supplémentaire fait baisser le taux d’achèvement.',\n  modOK:'Modules activés : {c} — {n} questions, environ {m} minutes. Dans la fourchette recommandée.',\n  modWarn:'{c} modules activés — soit {n} questions et environ {m} minutes. Les recommandations en préconisent trois au maximum. Demandez-vous lesquels vous exploiterez réellement.',\n  platTitle:'Création dans {p}', platLead:'À lire avant de commencer. Voici où {p} s’écarte des spécifications de la boîte à outils — autant de points sur lesquels un centre risque de perdre la comparabilité des données sans s’en rendre compte.',\n  platTypes:'Types de questions dans {p}',\n  introTitle:'Titre et introduction', introLead:'Vos informations sont déjà insérées. Créez une enquête vierge, puis collez chaque bloc.',\n  bTitle:'Titre de l’enquête', bDesc:'Introduction / description', bThanks:'Message de clôture — à conserver pour la dernière étape', copy:'Copier', copied:'Copié ✓',\n  qTextLbl:'Libellé de la question', copyQ:'Copier la question', copyAll:'Tout copier', copyRows:'Copier les lignes', inPlat:'Dans {p} :',\n  optionsLbl:'Options', scaleLbl:'Échelle / colonnes', rowsLbl:'Lignes / affirmations',\n  pasteHint:'Collez tout en une fois — la plupart des outils créent une option par ligne.', gridLbl:'Il s’agit d’une question en grille',\n  tCore:'SOCLE — ne pas reformuler', tRec:'RECOMMANDÉE', tMod:'MODULE FACULTATIF', docxBtn:'Télécharger le questionnaire (Word)', fEnvs:'Environnements pratiques', hintEnvs:'Nommez les outils utilisés dans vos exercices pratiques, non les exercices eux-mêmes. Ils deviennent les lignes de la question sur la réalisation.', inlineH:'Adaptez ceci à votre activité', inlineLead:'Saisissez-le ici et la question ci-dessus se met à jour aussitôt. Les fichiers exportés reprennent ce que vous saisissez.', fPartners:'Institutions partenaires', fMaterials:'Où se trouvent les supports', fSessions:'Séances données dans cette activité', fTopics:'Thèmes pour de futures activités possibles', phPartners:'ex. Université de X · Service météorologique Y', phMaterials:'ex. Moodle et la chaîne YouTube du Laboratoire virtuel', phSessions:'Une par ligne, telles qu’elles figuraient au programme. Elles deviennent les options de « quel thème avez-vous trouvé le plus difficile ? ».', phTopics:'Un par ligne — ce que votre Centre pourrait réellement proposer ensuite. Ils deviennent les options de « quelles activités futures souhaiteriez-vous ? ».', hintList:'Un élément par ligne.', paperNote:'Pour cette option, le questionnaire Word ci-dessous constitue le livrable : imprimez-le ou reconstituez-le dans votre propre système.', paperNote:'Pour cette option, le questionnaire Word ci-dessous constitue le livrable : imprimez-le ou reconstituez-le dans votre propre système.', brLbl:'EMBRANCHEMENT', submitLbl:'envoyer le formulaire', req:'Obligatoire', opt:'Facultative',\n  finalTitle:'Paramètres, embranchement et test avant lancement',\n  finalLead:'Ces points s’appliquent quel que soit l’outil retenu. La règle d’embranchement et les paramètres d’anonymat sont de loin les plus souvent négligés.',\n  finalNote:'Une fois les réponses recueillies, les huit indicateurs de la section 6 du guide se calculent dans n’importe quel tableur. Si votre Centre les communique avec les mêmes définitions, le Laboratoire virtuel peut les agréger à l’échelle du réseau — c’est précisément la raison de ne pas modifier les douze questions du socle.',\n  mods:['L’activité comportait des exercices pratiques','Elle s’est déroulée sur deux séances ou plus','Toujours utile ; coûte une question','Plusieurs outils d’interaction fonctionnaient en parallèle','Un test ou un certificat a été délivré','Public multirégional ou multilingue','Contenu en autonomie et en direct combinés','Le public est majoritairement composé d’agents des services météorologiques et hydrologiques nationaux'],\n  fb:[['Sauts de section',['{secN}','{secBr}']],\n      ['{brTitle}',['{brRule}','{branch}']],\n      ['Anonymat et accès',['Ne collectez pas automatiquement les adresses électroniques et n’enregistrez pas les noms.','N’exigez pas de connexion et ne limitez pas à une réponse par personne — ces deux options excluent les participants dont l’institution restreint les comptes externes.','Fixez une date de clôture correspondant à la date limite annoncée dans votre introduction{d}']],\n      ['Avant l’envoi',['Répondez vous-même à l’enquête en empruntant les deux branches de la question de consentement.','Exportez les réponses et vérifiez que les en-têtes de colonnes sont lisibles — c’est à partir de cet export que vous travaillerez.','Vérifiez que les deux grilles de compétences comportent des lignes identiques dans le même ordre. Si elles diffèrent, l’indicateur de gain d’apprentissage est inutilisable.']],\n      ['Programmez le suivi dès maintenant',['Inscrivez dès aujourd’hui l’enquête de suivi dans votre agenda{f}','Sans elle, la question de consentement recueille des adresses jamais utilisées, et le réseau n’apprend jamais si les acquis ont été appliqués.']]],\n  brMs:'Dans Microsoft Forms, cela se règle au niveau de la section, non de la question.', brOther:'Configurez-le comme une logique de saut ou une condition sur cette question.',\n  credit:'Élaboré dans le cadre du Laboratoire virtuel OMM–CGMS',\n  incomplete:'Certains champs de la première étape sont encore vides : le texte ci-dessous contient donc des espaces réservés entre crochets. Revenez à l’étape 1 et complétez-les avant de coller quoi que ce soit dans votre enquête.',\n  sn7:'Créez sept sections dans l’ordre indiqué dans la liste des étapes.', sn8:'Créez huit sections dans l’ordre indiqué dans la liste des étapes.', br7:'Les sections 6 et 7 doivent rester distinctes, car l’embranchement se situe entre les deux.', br8:'Les sections 7 et 8 doivent rester distinctes, car l’embranchement du consentement à l’entretien se situe entre les deux.',\n  bt1:'L’unique règle d’embranchement', bt2:'Les deux règles d’embranchement', br1:'Sur la question de consentement au suivi : « Oui » poursuit vers la section de contact ; « Non » termine l’enquête.', br2:'D’abord, sur la question d’application : les personnes qui n’ont pas appliqué ce qu’elles ont appris passent la section consacrée à la manière dont elles l’ont fait. Ensuite, sur la question d’entretien à la fin : « Oui » poursuit vers la section de contact ; « Non » termine l’enquête.', nfu:'Une fois les réponses recueillies, les six indicateurs du guide de l’enquête d’impact se calculent dans n’importe quel tableur. Présentez-les à côté des résultats de l’enquête immédiate : l’écart entre l’intention et l’action est le chiffre le plus précieux que le réseau puisse produire.',\n  allDone:'Toutes les étapes sont terminées',\n  fuModLead:'Les trois sont activés par défaut, ce qui donne l’instrument documenté de 16 questions. Désactivez-en un pour raccourcir l’enquête : les questions restantes sont renumérotées automatiquement.',\n  kicker:'Laboratoire virtuel OMM–CGMS · Boîte à outils d’évaluation v1.0 · Enquête immédiate après l’activité', scope:'Cet assistant construit l’enquête IMMÉDIATE de fin d’activité — celle envoyée dans les jours qui suivent, qui mesure la réaction, les acquis et l’intention d’appliquer.',\n  gsWarn:'Remarque : {n} entrées du fichier portent encore la mention INSERT … — les listes d’options que cet assistant ne recueille pas (thèmes futurs, éléments évalués, noms des séances). Recherchez INSERT dans le fichier et modifiez-les avant de l’exécuter.',\n  expLime:'Importez ce fichier dans LimeSurvey via Enquêtes → Créer → Importer : sections, types de questions, grilles et échelles arrivent intacts.', expLimeBtn:'Télécharger le fichier .lss', expDocx:'Téléversez ce fichier dans Microsoft Forms via Nouveau formulaire → Importer des questions. Les questions à choix et à texte arrivent ; les grilles et les règles d’embranchement doivent ensuite être ajoutées à la main.', expDocxBtn:'Télécharger le fichier Word', expJson:'Une définition JSON prête pour l’API de création de la plateforme. Publiez-la avec votre propre jeton d’accès — aucune donnée ne quitte cette page.', expJsonBtn:'Télécharger la définition JSON',\n  expH:'Fichier prêt à déployer', expLead:'Un fichier reprenant les informations que vous avez saisies, pour l’outil que vous avez choisi.',\n  impH:'Fichier prêt à importer pour {p}', impLead:'Tout ce que vous avez saisi est déjà rempli. Téléchargez le fichier {x} et importez-le dans {p}.', impBtn:'Télécharger le fichier {x}', gsH:'Script Apps Script prêt à l’emploi', gsLead:'Tout ce que vous avez saisi est déjà rempli. Collez ce fichier dans script.google.com et exécutez createSurvey — le formulaire est créé pour vous, sans saisie manuelle.', gsBtn:'Télécharger le fichier .gs', gsSteps:'1 · script.google.com → Nouveau projet   2 · supprimez Code.gs, collez ce fichier   3 · Exécuter → createSurvey   4 · autorisez ; les liens arrivent par courriel',\n  bnH:'Bannière d’en-tête', bnLead:'Une bannière pour le haut de votre enquête, adaptée au modèle et à la langue choisis. Complétez d’abord l’étape 1, puis téléchargez-la et importez-la dans le réglage de thème ou d’en-tête de votre outil.', bnBtn:'Télécharger la bannière (PNG)', bnT1:'Juste après l’activité', bnT2:'Enquête de suivi et d’impact',\n  bnSlot:'Votre logo', bnUp:'Le logo de votre organisation', bnUpHint:'Chargez un PNG ou un JPEG. Il reste dans ce navigateur et n’est envoyé nulle part.', bnRm:'Retirer', bnSz:'La taille suit l’outil choisi : {w} × {h} px',\n  navFinal:'Paramètres et test avant lancement', optOther:'Autre / papier', gener:'l’outil que vous avez choisi',\n  tk:['Choix unique','Liste déroulante','Choix multiple','Échelle 0–10','Grille / matrice','Texte court','Texte long','Courriel'] },\n\n es:{ docKicker:'VLAB OMM–CGMS · CONJUNTO DE HERRAMIENTAS DE EVALUACIÓN', navHide:'Ocultar los pasos', navShow:'Mostrar los pasos', addRow:'Añadir una fila', rmRow:'Eliminar esta fila', app:'Asistente de creación de encuestas', lblPlat:'Plataforma', lblLang:'Idioma de la encuesta', done:'completados', reset:'Reiniciar', steps:'Pasos',\n  qCount:'{n} preguntas, unos {m} min', qCountC:'{n} preguntas + {c} campos de contacto, unos {m} min', back:'Atrás', next:'Siguiente', markDone:'Marcar como completado', isDone:'Completado ✓',\n  keys:'Flechas para navegar · C para copiar la pregunta. El progreso se guarda en este navegador.',\n  submitLbl:'enviar el formulario', branchLbl:'A dónde lleva cada respuesta',\n  contactLbl:'Campo de contacto', stepOf:'Paso {i} de {n}', finalKicker:'Último paso', qOf:'Pregunta {i} de {n}', module:'módulo',\n  setupTitle:'Describa su actividad',\n  setupLead:'Estos datos se incorporan automáticamente a los botones de copia de los pasos siguientes, de modo que pegará un texto ya listo, sin campos pendientes. No se envía nada: todo queda en su navegador.',\n  fTitle:'Título de la actividad', fOrg:'Institución responsable', fCentre:'Centro de Excelencia', fDates:'Fechas de la actividad', fDeadline:'Fecha límite de respuesta', fSubject:'Tema de la actividad', phSubject:'p. ej. los datos de incendios y focos de calor', hintSubject:'Se usa en la P2 para preguntar con qué frecuencia su tema aparece en el trabajo del encuestado. Redáctelo como se leería a mitad de frase, en minúsculas.',\n  phTitle:'p. ej. Seguimiento de la sequía por satélite', phOrg:'p. ej. su institución', phCentre:'p. ej. Centro de Excelencia del Laboratorio Virtual', phDates:'p. ej. del 3 al 5 de marzo de 2027', phDeadline:'p. ej. 20 de marzo de 2027',\n  uLOTitle:'Los resultados de aprendizaje', uLOLead:'Copie los mismos resultados de aprendizaje de su encuesta inmediata, literalmente y en el mismo orden. La P6 compara ambas, de modo que cualquier cambio de redacción rompe la comparación.',\n  compTitle:'Competencias: lo único que conviene acertar',\n  compLead:'Describa acciones concretas que el participante pueda imaginarse realizando. Verbos de acción, no sustantivos de conocimiento. Una por fila: añada o elimine filas según necesite. Cuatro es el número recomendado; por encima de ese número la tabla resulta más difícil de completar, y cuatro bastan para detectar la ganancia de aprendizaje.',\n  compPh:'p. ej. una tarea concreta enseñada en su actividad',\n  modTitle:'Módulos opcionales', modLead:'Como máximo tres módulos. Las preguntas del núcleo y las recomendadas suman ya 17, y cada módulo adicional reduce la tasa de finalización.',\n  modOK:'Módulos activados: {c} — {n} preguntas, unos {m} minutos. Dentro del intervalo recomendado.',\n  modWarn:'{c} módulos activados: son {n} preguntas y unos {m} minutos. La orientación recomienda no más de tres. Piense cuáles va a aprovechar realmente.',\n  platTitle:'Creación en {p}', platLead:'Conviene leerlo antes de empezar. Aquí se señala en qué se aparta {p} de las especificaciones del conjunto de herramientas: son los puntos donde un Centro suele perder la comparabilidad de los datos sin darse cuenta.',\n  platTypes:'Tipos de pregunta en {p}',\n  introTitle:'Título e introducción', introLead:'Sus datos ya están insertados. Cree una encuesta en blanco y pegue cada bloque.',\n  bTitle:'Título de la encuesta', bDesc:'Introducción / descripción', bThanks:'Mensaje de cierre: consérvelo para el último paso', copy:'Copiar', copied:'Copiado ✓',\n  qTextLbl:'Texto de la pregunta', copyQ:'Copiar pregunta', copyAll:'Copiar todo', copyRows:'Copiar filas', inPlat:'En {p}:',\n  optionsLbl:'Opciones', scaleLbl:'Escala / columnas', rowsLbl:'Filas / afirmaciones',\n  pasteHint:'Pegue todo de una vez: la mayoría de las herramientas crean una opción por línea.', gridLbl:'Esta es una pregunta de tabla',\n  tCore:'NÚCLEO: no reformular', tRec:'RECOMENDADA', tMod:'MÓDULO OPCIONAL', docxBtn:'Descargar el cuestionario (Word)', fEnvs:'Entornos prácticos', hintEnvs:'Nombre las herramientas usadas en sus ejercicios prácticos, no los ejercicios en sí. Serán las filas de la pregunta sobre finalización.', inlineH:'Adapte esto a su actividad', inlineLead:'Escríbalo aquí y la pregunta de arriba se actualiza al instante. Los archivos exportados recogen lo que escriba.', fPartners:'Instituciones asociadas', fMaterials:'Dónde están los materiales', fSessions:'Sesiones impartidas en esta actividad', fTopics:'Temas para posibles actividades futuras', phPartners:'p. ej. Universidad de X · Servicio Meteorológico Y', phMaterials:'p. ej. Moodle y el canal de YouTube del Laboratorio Virtual', phSessions:'Una por línea, tal como figuraban en el programa. Serán las opciones de «¿qué tema le resultó más difícil?».', phTopics:'Uno por línea: lo que su Centro podría ofrecer realmente después. Serán las opciones de «¿qué actividades futuras desearía?».', hintList:'Un elemento por línea.', paperNote:'Para esta opción, el cuestionario Word que figura abajo es el producto final: imprímalo o recréelo en su propio sistema.', paperNote:'Para esta opción, el cuestionario Word que figura abajo es el producto final: imprímalo o recréelo en su propio sistema.', brLbl:'BIFURCACIÓN', submitLbl:'enviar el formulario', req:'Obligatoria', opt:'Opcional',\n  finalTitle:'Ajustes, bifurcación y prueba previa al lanzamiento',\n  finalLead:'Estos puntos son válidos con cualquier herramienta. La regla de bifurcación y la configuración del anonimato son, con diferencia, las que más se pasan por alto.',\n  finalNote:'Una vez recibidas las respuestas, los ocho indicadores de la sección 6 de la guía se calculan en cualquier hoja de cálculo. Si su Centro los comunica con las mismas definiciones, el Laboratorio Virtual puede agregarlos a escala de red, y por eso precisamente las doce preguntas del núcleo no deben modificarse.',\n  mods:['La actividad incluyó ejercicios prácticos','Se desarrolló en dos o más sesiones','Siempre útil; cuesta una pregunta','Varias herramientas de interacción funcionaron en paralelo','Se aplicó una prueba o se emitió un certificado','Público multirregional o multilingüe','Se combinó contenido autoguiado y en directo','El público está formado mayoritariamente por personal de servicios meteorológicos e hidrológicos nacionales'],\n  fb:[['Saltos de sección',['{secN}','{secBr}']],\n      ['{brTitle}',['{brRule}','{branch}']],\n      ['Anonimato y acceso',['No recopile automáticamente las direcciones de correo ni registre los nombres.','No exija inicio de sesión ni limite a una respuesta por persona: ambas cosas excluyen a participantes cuyas instituciones restringen las cuentas externas.','Fije una fecha de cierre que coincida con la fecha límite anunciada en su introducción{d}']],\n      ['Antes de enviarla',['Responda la encuesta usted en persona, recorriendo las dos ramas de la pregunta de consentimiento.','Exporte las respuestas y compruebe que los encabezados de columna son legibles: trabajará a partir de ese archivo.','Confirme que las dos tablas de competencias tienen filas idénticas en el mismo orden. Si difieren, el indicador de ganancia de aprendizaje queda invalidado.']],\n      ['Agende ya el seguimiento',['Anote hoy mismo en su calendario la encuesta de seguimiento{f}','Sin ella, la pregunta de consentimiento recopila direcciones que nunca se usan, y la red nunca llega a saber si lo aprendido se aplicó.']]],\n  brMs:'En Microsoft Forms esto se configura en la sección, no en la pregunta.', brOther:'Configúrelo como lógica de salto o condición en esa pregunta.',\n  credit:'Elaborado en el marco del Laboratorio Virtual OMM–CGMS',\n  incomplete:'Algunos campos de la configuración siguen vacíos, por lo que el texto de abajo contiene marcadores entre corchetes. Vuelva al paso 1 y complételos antes de pegar nada en su encuesta.',\n  sn7:'Cree siete secciones en el orden que muestra la lista de pasos.', sn8:'Cree ocho secciones en el orden que muestra la lista de pasos.', br7:'Las secciones 6 y 7 deben ser independientes, porque la bifurcación s o acompanhamento: “Sim” segue para a seção de contato; “Não” encerra o questionário.', br2:'Primeiro, na pergunta de aplicação: quem não aplicou o que aprendeu salta a seção sobre como o aplicou. Depois, na pergunta de entrevista ao final: “Sim” segue para a seção de contato; “Não” encerra o questionário.', nfu:'Assim que as respostas chegarem, os seis indicadores do guia do questionário de impacto podem ser calculados em qualquer planilha. Apresente-os ao lado dos resultados do questionário imediato — a distância entre intenção e ação é o número mais valioso que a rede pode produzir.',\n  allDone:'Todas as etapas concluídas',\n  fuModLead:'Os três estão ativados por padrão, o que dá o instrumento documentado de 16 perguntas. Desative um para encurtar o questionário — as perguntas restantes são renumeradas automaticamente.',\n  kicker:'VLab OMM–CGMS · Conjunto de ferramentas de avaliação v1.0 · Questionário imediato pós-atividade', scope:'Este assistente cria o questionário IMEDIATO pós-atividade — aquele enviado poucos dias depois, que mede reação, aprendizagem e intenção de aplicar.',\n  gsWarn:'Observação: {n} entradas do arquivo ainda dizem INSERT … — são as listas de opções que este assistente não coleta (temas futuros, itens avaliados, nomes das sessões). Procure INSERT no arquivo e edite-as antes de executar.',\n  expLime:'Importe este arquivo no LimeSurvey em Questionários → Criar → Importar: seções, tipos de pergunta, grades e escalas chegam intactos.', expLimeBtn:'Baixar arquivo .lss', expDocx:'Envie este arquivo no Microsoft Forms em Novo formulário → Importar perguntas. As perguntas de escolha e de texto chegam; as grades e as regras de ramificação devem ser acrescentadas depois à mão.', expDocxBtn:'Baixar arquivo do Word', expJson:'Uma definição JSON pronta para a API de criação da plataforma. Envie-a com seu próprio token de acesso — nenhum dado sai desta página.', expJsonBtn:'Baixar definição JSON',\n  expH:'Arquivo pronto para uso', expLead:'Um arqui
