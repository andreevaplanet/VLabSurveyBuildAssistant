ua participação?',\\n    qAttritionReasons: 'Se não acompanhou tudo, quais foram os principais motivos?',\\n    qChannels: 'Quão útil foi cada item a seguir?',\\n    qBarriers: 'Algum dos itens a seguir dificultou sua participação?',\\n    qAsyncBalance: 'Como foi o equilíbrio entre o material autoinstrucional e as sessões ao vivo?',\\n    qHardest: 'Qual tema você achou mais difícil?',\\n    qAssessmentFair: 'A avaliação de aprendizagem refletiu de forma justa o conteúdo da atividade',\\n    qInstitutionalSupport: 'Sua organização apoia você na aplicação do que aprendeu?',\\n    qMostValuable: 'O que foi mais valioso para você nesta atividade?',\\n    qOneChange: 'Qual mudança traria a maior melhoria para a próxima edição?',\\n    qFutureTopics: 'Quais atividades futuras você gostaria que oferecêssemos?',\\n\\n    openHelpValuable: 'Opcional, mas uma ou duas frases aqui nos são mais úteis que qualquer nota acima.',\\n    openHelpChange: 'Opcional. A crítica é genuinamente bem-vinda — é o que muda a próxima atividade.',\\n    followUpHelp: 'Um questionário curto, de cerca de três minutos, em {month}. Seu endereço é usado apenas para esse contato e nunca é vinculado às suas respostas acima em qualquer resultado publicado.',\\n    followUpYes: 'Sim, podem entrar em contato',\\n    followUpNo: 'Não, agradeço',\\n    emailInvalid: 'Informe um endereço de e-mail válido.',\\n    selectUpToThree: 'Marque até três opções.',\\n    selectUpToFive: 'Marque até cinco opções.',\\n    noneWasDifficult: 'Nenhum — acompanhei tudo com tranquilidade',\\n    npsLow: 'Nada provável',\\n    npsHigh: 'Extremamente provável',\\n\\n    overallScale: ['Excelente', 'Muito boa', 'Boa', 'Regular', 'Ruim'],\\n    agreementCols: ['Discordo totalmente', 'Discordo', 'Nem concordo nem discordo', 'Concordo', 'Concordo totalmente', 'Não se aplica'],\\n    agreementRows: [\\n      'O conteúdo foi relevante para meu trabalho ou meus estudos',\\n      'O nível de dificuldade foi adequado para mim',\\n      'A atividade foi bem organizada e as informações foram claras',\\n      'Tive oportunidade suficiente de fazer perguntas e interagir',\\n      'A atividade correspondeu ao que foi anunciado'\\n    ],\\n    qualityCols: ['Insuficiente', 'Regular', 'Bom', 'Muito bom', 'Excelente'],\\n    abilityCols: ['Ainda não tenho', 'Nível básico', 'Nível intermediário', 'Nível avançado', 'Poderia ensinar outras pessoas'],\\n    confidenceScale: ['Muito confiante', 'Confiante', 'Razoavelmente confiante', 'Pouco confiante', 'Nada confiante'],\\n    intentScale: ['Com certeza', 'Provavelmente', 'Não sei dizer', 'Provavelmente não', 'Com certeza não'],\\n    paceScale: ['Lento demais', 'Um pouco lento', 'Adequado', 'Um pouco rápido', 'Rápido demais'],\\n    practicalCols: ['Todos', 'A maioria', 'Apenas em parte', 'Nenhum', 'Não tentei'],\\n    practicalHelpOptions: [\\n      'Uma verificação técnica prévia para confirmar que meu ambiente funcionava',\\n      'Um segundo instrutor respondendo às dúvidas no chat',\\n      'Materiais com pontos de retomada, para reentrar em cada seção',\\n      'Um ritmo mais lento, com pausas regulares de verificação',\\n      'Material preparatório enviado antes da atividade',\\n      'Nada — os exercícios práticos funcionaram bem para mim'\\n    ],\\n    attendanceOptions: [\\n      'Acompanhei tudo ao vivo',\\n      'Acompanhei a maior parte ao vivo',\\n      'Acompanhei cerca da metade ao vivo',\\n      'Participei apenas da sessão de abertura',\\n      'Acompanhei principalmente pelas gravações'\\n    ],\\n    attritionOptions: [\\n      'Conflito com compromissos de trabalho',\\n      'Horário inadequado para meu fuso horário',\\n      'O ritmo foi rápido demais',\\n      'O conteúdo foi mais avançado do que eu esperava',\\n      'O conteúdo foi menos avançado do que eu esperava',\\n      'Dificuldades técnicas ou de conexão',\\n      'Preferi assistir às gravações depois'\\n    ],\\n    channelRows: [\\n      'O chat ao vivo',\\n      'A ferramenta de perguntas e respostas',\\n      'A plataforma de ensino',\\n      'As gravações',\\n      'O contato por e-mail com os instrutores'\\n    ],\\n    channelCols: ['Não utilizei', 'Nada útil', 'Útil', 'Muito útil'],\\n    barrierOptions: [\\n      'O idioma da atividade',\\n      'O fuso horário das sessões ao vivo',\\n      'A velocidade da minha internet',\\n      'Acesso a software ou licenças na minha instituição',\\n      'Uma necessidade de acessibilidade não atendida',\\n      'Nenhum destes'\\n    ],\\n    asyncBalanceOptions: [\\n      'Material autoinstrucional em excesso',\\n      'O equilíbrio foi adequado',\\n      'Conteúdo ao vivo em excesso',\\n      'Eu teria preferido só material autoinstrucional',\\n      'Eu teria preferido só sessões ao vivo'\\n    ],\\n    institutionalOptions: [\\n      'Sim, ativamente — tenho tempo e recursos alocados',\\n      'Sim, em princípio, mas sem tempo dedicado',\\n      'Não, mas vou aplicar mesmo assim',\\n      'Não, e isso vai me impedir de aplicar',\\n      'Ainda não sei'\\n    ],\\n    orgTypes: [\\n      'Serviço meteorológico ou hidrológico nacional',\\n      'Outro órgão público',\\n      'Universidade ou instituto de pesquisa',\\n      'Sou estudante, ainda sem atuação no setor',\\n      'Empresa do setor privado',\\n      'ONG ou organização internacional'\\n    ],\\n    experienceBands: [\\n      'Nenhum — esta atividade foi meu primeiro contato',\\n      'Menos de 1 ano',\\n      'De 1 a 3 anos',\\n      'De 4 a 10 anos',\\n      'Mais de 10 anos'\\n    ],\\n    countries: [\\n      'Angola', 'Argentina', 'Bolívia', 'Brasil', 'Cabo Verde', 'Chile',\\n      'Colômbia', 'Costa Rica', 'Cuba', 'Equador', 'El Salvador', 'Espanha',\\n      'Guatemala', 'Guiné-Bissau', 'Guiana', 'Honduras', 'México',\\n      'Moçambique', 'Nicarágua', 'Panamá', 'Paraguai', 'Peru', 'Portugal',\\n      'República Dominicana', 'São Tomé e Príncipe', 'Suriname',\\n      'Timor-Leste', 'Uruguai', 'Venezuela', 'Outro país'\\n    ]\\n  }\\n};\\n\",\n  followup: \"/**\\n * ============================================================================\\n *  WMO–CGMS VLAB — GENERIC FOLLOW-UP IMPACT SURVEY\\n *  Recommended template for VLab Centres of Excellence and training providers\\n *  Toolkit component 4 · Version 1.0\\n * ============================================================================\\n *\\n *  WHAT THIS IS\\n *  The companion to the immediate post-course survey. That instrument measures\\n *  reaction and learning; it cannot measure effect, because effect has not yet\\n *  happened. This one, sent some months later to those who consented, is the\\n *  only instrument in the toolkit that can tell WMO whether its training\\n *  changed what people actually do — Kirkpatrick level 3.\\n *\\n *  Without it, the consent question in the immediate survey collects addresses\\n *  that are never used, and the network reports effort in place of outcome.\\n *\\n *  HOW TO USE IT\\n *  1. Open script.google.com and choose New project.\\n *  2. Delete the contents of Code.gs and paste this whole file.\\n *  3. Edit ONLY the CONFIG block below — that is where your course details go.\\n *  4. Switch optional modules on or off in the MODULES block.\\n *  5. Run the function  createSurvey  and authorize the access request.\\n *  6. WHERE THE LINK APPEARS. Three places, so you cannot miss it:\\n *       - emailed to you, as a clickable button (unless you switch that off);\\n *       - printed in the execution log — press Ctrl+Enter to open that panel;\\n *       - and the form itself is now in your Google Drive, named after the\\n *         course, so you can also just open drive.google.com and find it.\\n *  7. From that point you work entirely in the normal Google Forms interface.\\n *     You do not need to come back to Apps Script to edit or add questions —\\n *     the script only builds the first version for you.\\n *\\n *  RULES OF ADAPTATION\\n *  - Do NOT change the wording of anything marked [CORE]. Those questions are\\n *    what make results comparable across the VLab network.\\n *  - DO adapt anything marked [ADAPT] to your own course. Two items matter\\n *    more than the rest: the competencies and the course subject.\\n *  - DO switch [OPTIONAL] modules on or off to suit your activity.\\n *  - Keep the total near 16 questions. Response rates at follow-up are\\n *    already the binding constraint; every question you add costs you more\\n *    here than it would in the immediate survey.\\n *\\n *  Respondent burden: 16 questions plus 2 contact fields with no module\\n *  enabled, about 8 minutes. All four modules enabled gives 21 questions,\\n *  about 10 minutes. Enabling no more than two keeps it near 9 minutes.\\n *\\n *  CRITICAL: the competencies in CONFIG must be copied verbatim, and in\\n *  the same order, from the immediate survey you already ran. The whole point\\n *  of question 4 is the comparison against that earlier measure, and any\\n *  difference in wording destroys it.\\n * ============================================================================\\n */\\n\\n/* ══════════════════════════════════════════════════════════════════════════\\n   CONFIG — edit this block, and nothing below it\\n   ══════════════════════════════════════════════════════════════════════════ */\\n\\nvar CONFIG = {\\n\\n  // ---- Identity of the activity -------------------------------------------\\n  courseTitle:      'INSERT COURSE TITLE HERE',\\n  organizer:        'INSERT LEAD INSTITUTION HERE',\\n  centreOfExcellence: 'INSERT CENTRE OF EXCELLENCE NAME HERE',\\n  partners:         '',   // '' if none\\n  courseDates:      'INSERT COURSE DATES HERE',        // e.g. '3 to 5 March 2027'\\n  deadline:         'INSERT RESPONSE DEADLINE HERE',   // e.g. '20 June 2027'\\n\\n  // ---- Delivery of the links ---------------------------------------------\\n  // true emails the edit link and the participant link to whoever runs the\\n  // script, so they arrive somewhere clickable. Set false to use only the log.\\n  emailLinksToMe: true,\\n\\n  // ---- Language -----------------------------------------------------------\\n  // 'en' or 'pt'. To run the survey in another language, translate the STRINGS\\n  // block near the end of this file and add your language code there.\\n  language: 'en',\\n\\n  // ---- The subject of the course [ADAPT] ---------------------------------\\n  // Used in question 2, mid-sentence, in lower case. Write it as it would read\\n  // in \\\"How often does ___ feature in your work?\\\"\\n  // Good:  'satellite soil-moisture data'   /   'wildfire and active-fire data'\\n  // Poor:  'The Course'   /   'Remote Sensing'\\n  subject: 'INSERT SUBJECT OF THE COURSE — lower case, mid-sentence',\\n\\n  // ---- Competencies [ADAPT] · MOST IMPORTANT EDIT -----------------------\\n  // Copy these VERBATIM and in the SAME ORDER from the immediate survey you\\n  // ran after the course. Question 4 asks how often each has been applied\\n  // since; read against the immediate survey's before-and-after grid, that is\\n  // what turns a claim of learning into evidence of use.\\n  competencies: [\\n    'INSERT COMPETENCY 1 — exactly as worded in your immediate survey',\\n    'INSERT COMPETENCY 2',\\n    'INSERT COMPETENCY 3',\\n    'INSERT COMPETENCY 4'\\n  ],\\n\\n  // ---- Institutional outcomes rated in question 8 [ADAPT] ----------------\\n  // Four ways the training might have changed things beyond the individual.\\n  // Keep them observable. Adapt the wording to your subject; the first and\\n  // last are usually worth keeping as they are.\\n  institutionalOutcomes: [\\n    'I work more efficiently on the tasks the course covered',\\n    'My institution produces a new product or service',\\n    'An existing product or service has improved',\\n    'Information reaches decision-makers better than before'\\n  ],\\n\\n  // ---- Support options offered in question 14 [ADAPT] --------------------\\n  // What your Centre could realistically provide over the next six months.\\n  // Do not offer what you cannot deliver — an unmet signal is worse than none.\\n  supportOptions: [\\n    'A short refresher session on the material',\\n    'A more advanced follow-on course',\\n    'Written step-by-step guidance for the main workflows',\\n    \\n    'Worked examples using data from my own region',\\n    'A channel for asking the instructors technical questions',\\n    'A community of practice with other course participants',\\n    'Help persuading my institution to prioritise this work',\\n    'Nothing further — I have what I need'\\n  ]\\n};\\n\\n/* ══════════════════════════════════════════════════════════════════════════\\n   MODULES — switch optional blocks on or off\\n   Each one costs response rate, and at follow-up that matters more than it\\n   did immediately after the course. Two is a sensible ceiling.\\n   ══════════════════════════════════════════════════════════════════════════ */\\n\\nvar MODULES = {\\n  diffusion:     true,   // how the learning was shared, and with how many\\n  barriers:      true,   // what stood in the way, and what helped\\n  interview:     true,   // consent to a short conversation, plus contact fields\\n  certification: false   // whether a certificate was used or recognised\\n};\\n\\n/* ══════════════════════════════════════════════════════════════════════════\\n   BUILDER — no need to edit below this line\\n   ══════════════════════════════════════════════════════════════════════════ */\\n\\nfunction createSurvey() {\\n  var S = STRINGS[CONFIG.language] || STRINGS.en;\\n  var C = CONFIG;\\n\\n  _warnIfPlaceholdersRemain();\\n\\n  var form = FormApp.create(S.formTitle.replace(/\\{course\\}/g, C.courseTitle));\\n  form.setDescription(_buildDescription(S, C));\\n  form.setCollectEmail(false);\\n  form.setProgressBar(true);\\n  form.setAllowResponseEdits(true);\\n  form.setConfirmationMessage(S.thanks);\\n\\n  // ── SECTION 1 · Situation since the course [CORE] ────────────────────────\\n  // Two profile questions and the branch. Kept short: at follow-up the\\n  // respondent has already told you who they are once.\\n  form.addPageBreakItem().setTitle(S.s1Title).setHelpText(S.s1Help);\\n\\n  form.addMultipleChoiceItem()\\n    .setTitle(S.qOrgType)\\n    .setChoiceValues(S.orgTypes)\\n    .showOtherOption(true)\\n    .setRequired(true);\\n\\n  form.addMultipleChoiceItem()\\n    .setTitle(S.qSubjectFrequency.replace(/\\{subject\\}/g, C.subject))\\n    .setChoiceValues(S.frequencyBands)\\n    .setRequired(true);\\n\\n  // The one branch that matters: those who could not apply anything skip the\\n  // \\\"how did you apply it\\\" section but are still asked about barriers.\\n  var qUsed = form.addMultipleChoiceItem()\\n    .setTitle(S.qUsed)\\n    .setHelpText(S.qUsedHelp)\\n    .setRequired(true);\\n\\n  // ── SECTION 2 · What you have used [CORE] ────────────────────────────────\\n  var s2 = form.addPageBreakItem().setTitle(S.s2Title).setHelpText(S.s2Help);\\n\\n  form.addGridItem()\\n    .setTitle(S.qApplied)\\n    .setRows(C.competencies)\\n    .setColumns(S.appliedCols)\\n    .setRequired(true);\\n\\n  form.addMultipleChoiceItem()\\n    .setTitle(S.qConfidence)\\n    .setChoiceValues(S.confidenceBands)\\n    .setRequired(true);\\n\\n  // ── SECTION 3 · A concrete example [CORE] ────────────────────────────────\\n  // Optional, and the single most valuable field in the instrument. In every\\n  // follow-up study of this kind, this is what persuades governance.\\n  form.addPageBreakItem().setTitle(S.s3Title).setHelpText(S.s3Help);\\n\\n  form.addParagraphTextItem()\\n    .setTitle(S.qExample)\\n    .setHelpText(S.qExampleHelp)\\n    .setRequired(false);\\n\\n  form.addCheckboxItem()\\n    .setTitle(S.qChanged)\\n    .setHelpText(S.selectAll)\\n    .setChoiceValues(S.changedOptions)\\n    .setRequired(true);\\n\\n  form.addGridItem()\\n    .setTitle(S.qContribution)\\n    .setRows(C.institutionalOutcomes)\\n    .setColumns(S.contributionCols)\\n    .setRequired(false);\\n\\n  // ── MODULE · Diffusion [OPTIONAL] ────────────────────────────────────────\\n  // Turns a course of thirty into a defensible reach figure of ninety or more.\\n  var qShared = null;\\n  var s4 = null;\\n  if (MODULES.diffusion) {\\n    s4 = form.addPageBreakItem().setTitle(S.s4Title).setHelpText(S.s4Help);\\n\\n    qShared = form.addMultipleChoiceItem()\\n      .setTitle(S.qShared)\\n      .setRequired(true);\\n\\n    form.addCheckboxItem()\\n      .setTitle(S.qSharedHow)\\n      .setChoiceValues(S.sharedHowOptions)\\n      .setRequired(false);\\n\\n    form.addMultipleChoiceItem()\\n      .setTitle(S.qColleagues)\\n      .setChoiceValues(S.colleagueBands)\\n      .setRequired(false);\\n  }\\n\\n  // ── MODULE · Barriers and enablers [OPTIONAL] ────────────────────────────\\n  // Asked of everyone, including those who applied nothing — and including\\n  // those who succeeded. Someone who applied the training despite obstacles\\n  // knows precisely what those obstacles were and how they were overcome.\\n  var s5 = form.addPageBreakItem().setTitle(S.s5Title).setHelpText(S.s5Help);\\n\\n  if (MODULES.barriers) {\\n    form.addGridItem()\\n      .setTitle(S.qObstacles)\\n      .setRows(S.obstacleRows)\\n      .setColumns(S.obstacleCols)\\n      .setRequired(true);\\n\\n    form.addGridItem()\\n      .setTitle(S.qEnablers)\\n      .setRows(S.enablerRows)\\n      .setColumns(S.enablerCols)\\n      .setRequired(false);\\n  }\\n\\n  // ── MODULE · Certification [OPTIONAL] ────────────────────────────────────\\n  if (MODULES.certification) {\\n    form.addMultipleChoiceItem()\\n      .setTitle(S.qCertificate)\\n      .setChoiceValues(S.certificateOptions)\\n      .setRequired(false);\\n  }\\n\\n  // ── SECTION 6 · What would help now [CORE] ───────────────────────────────\\n  form.addPageBreakItem().setTitle(S.s6Title);\\n\\n  form.addCheckboxItem()\\n    .setTitle(S.qSupport)\\n    .setHelpText(S.selectUpToThree)\\n    .setChoiceValues(C.supportOptions)\\n    .setRequired(true);\\n\\n  form.addParagraphTextItem()\\n    .setTitle(S.qAnythingElse)\\n    .setHelpText(S.qAnythingElseHelp)\\n    .setRequired(false);\\n\\n  // ── MODULE · Interview consent and contact [OPTIONAL] ────────────────────\\n  // Interview volunteers are where case studies come from. A case study is\\n  // worth more to governance reporting than any percentage in this survey.\\n  var qInterview = null;\\n  var s8 = null;\\n  if (MODULES.interview) {\\n    form.addPageBreakItem().setTitle(S.s7Title).setHelpText(S.s7Help);\\n\\n    qInterview = form.addMultipleChoiceItem()\\n      .setTitle(S.qInterview)\\n      .setHelpText(S.qInterviewHelp)\\n      .setRequired(true);\\n\\n    s8 = form.addPageBreakItem().setTitle(S.s8Title).setHelpText(S.s8Help);\\n\\n    form.addTextItem()\\n      .setTitle(S.qName)\\n      .setRequired(true);\\n\\n    form.addTextItem()\\n      .setTitle(S.qEmail)\\n      .setHelpText(S.emailInvalid)\\n      .setRequired(true)\\n      .setValidation(FormApp.createTextValidation()\\n        .setHelpText(S.emailInvalid)\\n        .requireTextIsEmail()\\n        .build());\\n  }\\n\\n  // ── Branching, applied last so every target page already exists ──────────\\n  qUsed.setChoices([\\n    qUsed.createChoice(S.usedYes, s2),\\n    qUsed.createChoice(S.usedNotYet, s5),\\n    qUsed.createChoice(S.usedNo, s5)\\n  ]);\\n\\n  if (qShared) {\\n    qShared.setChoices([\\n      qShared.createChoice(S.sharedYes, s5),\\n      qShared.createChoice(S.sharedIntend, s5),\\n      qShared.createChoice(S.sharedNo, s5)\\n    ]);\\n  }\\n\\n  if (qInterview && s8) {\\n    qInterview.setChoices([\\n      qInterview.createChoice(S.interviewYes, s8),\\n      qInterview.createChoice(S.interviewNo, FormApp.PageNavigationType.SUBMIT)\\n    ]);\\n  }\\n\\n  return _reportLinks(form, S);\\n}\\n\\n/** Flags any CONFIG value still holding placeholder text. */\\nfunction _warnIfPlaceholdersRemain() {\\n  var flat = [], k;\\n  for (k in CONFIG) {\\n    if (Object.prototype.hasOwnProperty.call(CONFIG, k)) {\\n      var v = CONFIG[k];\\n      if (typeof v === 'string') flat.push(k + ': ' + v);\\n      else if (Object.prototype.toString.call(v) === '[object Array]') {\\n        for (var i = 0; i < v.length; i++) flat.push(k + '[' + i + ']: ' + v[i]);\\n      }\\n    }\\n  }\\n  var pending = [];\\n  for (var j = 0; j < flat.length; j++) {\\n    if (flat[j].indexOf('INSERT') !== -1) pending.push(flat[j]);\\n  }\\n  if (pending.length) {\\n    Logger.log('⚠  ' + pending.length + ' CONFIG entries still contain placeholder text:');\\n    for (var m = 0; m < pending.length; m++) Logger.log('     ' + pending[m]);\\n    Logger.log('   The survey will still be created, but edit these before sending it.');\\n    Logger.log('   The competencies matter most: they must match your immediate');\\n    Logger.log('   survey verbatim, or question 4 cannot be compared against it.');\\n  }\\n}\\n\\nfunction _buildDescription(S, C) {\\n  var parts = [];\\n  var opening = S.descOpening\\n    .replace(/\\\\{course\\\\}/g, C.courseTitle)\\n    .replace(/\\\\{dates\\\\}/g, C.courseDates)\\n    .replace(/\\\\{organizer\\\\}/g, C.organizer)\\n    ;\\n  if (!String(C.centreOfExcellence || '').trim()) {\\n    opening = opening.replace(/\\\\s*[—–-]\\\\s*\\\\{centre\\\\}/g, '').replace(/\\\\{centre\\\\}/g, '');\\n  }\\n  opening = opening.replace(/\\\\{centre\\\\}/g, C.centreOfExcellence);\\n  if (C.partners && S.descPartners) { opening = opening.replace(/([.。])\\\\s*$/, ', ' + S.descPartners.replace(/\\{partners\\}/g, C.partners) + '$1'); }\\n  parts.push(opening);\\n  parts.push(S.descPurpose);\\n  parts.push(S.descBurden);\\n  parts.push(S.descConfidentiality);\\n  parts.push(S.descCandour);\\n  parts.push(S.descDeadline.replace(/\\{deadline\\}/g, C.deadline));\\n  return parts.join('\\\\n\\\\n');\\n}\\n\\nfunction _reportLinks(form, S) {\\n  var editUrl = form.getEditUrl();\\n  var liveUrl = form.getPublishedUrl();\\n\\n  Logger.log('');\\n  Logger.log('════════════════════════════════════════════════════════════');\\n  Logger.log('  IMPACT SURVEY CREATED');\\n  Logger.log('  ' + CONFIG.courseTitle);\\n  Logger.log('════════════════════════════════════════════════════════════');\\n  Logger.log('');\\n  Logger.log('  OPEN AND EDIT IN GOOGLE FORMS:');\\n  Logger.log('  ' + editUrl);\\n  Logger.log('');\\n  Logger.log('  SEND THIS ONE TO PARTICIPANTS:');\\n  Logger.log('  ' + liveUrl);\\n  Logger.log('');\\n  Logger.log('════════════════════════════════════════════════════════════');\\n  Logger.log('  The form is also in your Google Drive, named after the course.');\\n  Logger.log('  Send it ONLY to those who consented in the immediate survey.');\\n  Logger.log('  Name the course and its dates in the subject line — three');\\n  Logger.log('  months on, a generic invitation will not be recognised.');\\n  Logger.log('  Report the denominator with every figure you publish.');\\n  Logger.log('════════════════════════════════════════════════════════════');\\n\\n  if (CONFIG.emailLinksToMe) {\\n    try {\\n      var me = Session.getEffectiveUser().getEmail();\\n      if (me) {\\n        MailApp.sendEmail({\\n          to: me,\\n          subject: 'Impact survey ready: ' + CONFIG.courseTitle,\\n          htmlBody:\\n            '<p style=\\\"font:15px/1.5 Arial,sans-serif\\\">Your follow-up impact survey has been created and is in your Google Drive.<\u002Fp>' +\\n            '<p style=\\\"font:15px/1.5 Arial,sans-serif\\\"><a href=\\\"' + editUrl + '\\\" ' +\\n            'style=\\\"display:inline-block;background:#005BAA;color:#fff;padding:12px 20px;' +\\n            'border-radius:5px;text-decoration:none;font-weight:bold\\\">Open and edit in Google Forms<\u002Fa><\u002Fp>' +\\n            '<p style=\\\"font:15px/1.5 Arial,sans-serif\\\">Link to send to participants:<br>' +\\n            '<a href=\\\"' + liveUrl + '\\\">' + liveUrl + '<\u002Fa><\u002Fp>' +\\n            '<p style=\\\"font:13px/1.5 Arial,sans-serif;color:#6B7280\\\">Send it only to those who consented in the ' +\\n            'immediate survey. Anyone who declined must not receive it. Complete the form yourself first, taking ' +\\n            'both branches of the final question, and confirm that the abilities in question 4 match your ' +\\n            'immediate survey word for word.<\u002Fp>'\\n        });\\n        Logger.log('  Links also emailed to ' + me);\\n      }\\n    } catch (e) {\\n      Logger.log('  (Could not send the email: ' + e.message + '. The links above still work.)');\\n    }\\n  }\\n\\n  return editUrl;\\n}\\n\\n/* ══════════════════════════════════════════════════════════════════════════\\n   STRINGS — the wording of the instrument\\n   Text marked [CORE] should not be reworded when adapting. To add a language,\\n   copy the whole 'en' block, translate it, and set CONFIG.language to match.\\n   ══════════════════════════════════════════════════════════════════════════ */\\n\\nvar STRINGS = {\\n\\n  en: {\\n    formTitle: 'Some months on: {course}',\\n\\n    descOpening: 'Some months ago you took part in the training course “{course}”, delivered {dates} by {organizer} — {centre}, under the WMO–CGMS Virtual Laboratory for Education and Training in Satellite Meteorology.',\\n    descPartners: 'in partnership with {partners}',\\n    descPurpose: 'You told us then what you had learned. This short questionnaire asks a harder question: what, if anything, you have been able to do with it since.',\\n    descBurden: 'It takes about 8 minutes. Most questions are a single click.',\\n    descConfidentiality: 'Responses are treated confidentially and reported only in aggregate; no individual response is attributed. The contact fields at the end appear only if you agree to a short conversation.',\\n    descCandour: 'If the honest answer is that you have not used it, please say so. That finding is as useful to us as any success, and it is the on drop steps that no longer exist\n    try{\n      const prev=this.state.byTpl; this.state.byTpl=b;\n      const max=this.steps();\n      this.state.byTpl=prev;\n      const d=b[this.state.tpl].done||{}, kept={};\n      Object.keys(d).forEach(k=>{ const n=+String(k).replace(/^s/,''); if(n>=0 && n<max) kept[k]=1; });\n      b[this.state.tpl]=Object.assign({},b[this.state.tpl],{done:kept});\n      if(b[this.state.tpl].step>=max) b[this.state.tpl].step=Math.max(0,max-1);\n    }catch(e){}\n    this.setState({byTpl:b}); this.saveAll({byTpl:b}); return b;\n  }\n  saveAll(patch){\n    const n=Object.assign({tpl:this.state.tpl, platform:this.state.platform, lang:this.state.lang,\n      orgLogo:this.state.orgLogo||'', byTpl:this.state.byTpl||{}}, patch);\n    try{ localStorage.setItem('vlab-build-assistant', JSON.stringify(n)); }catch(e){}\n  }\n  normaliseStore(){\n    const by=Object.assign({},this.state.byTpl||{}); let touched=false;\n    Object.keys(by).forEach(t=>{\n      const st0=by[t]; if(!st0||!st0.cfg) return;\n      const cfg=Object.assign({},st0.cfg);\n      ['comps','envs','topics','sessions','components','agreeRows','changeRows','contribRows'].forEach(k=>{\n        if(cfg[k]!==undefined && !Array.isArray(cfg[k])){ cfg[k]=this.asList(cfg[k]); touched=true; }\n        // pre-marker snapshots cannot be validated; drop them so current defaults apply\n        if(['components','agreeRows','changeRows','contribRows'].indexOf(k)>=0 && Array.isArray(cfg[k]) && !cfg['__seed_'+k]){\n          delete cfg[k]; touched=true; return; }\n        // phantom blanks accumulated by earlier builds: trim to one, ONCE, at load\n        if(Array.isArray(cfg[k])){\n          const a=cfg[k].slice(); let n=0;\n          for(let z=a.length-1; z>=0 && !String(a[z]).trim(); z--) n++;\n          if(n>1){ cfg[k]=a.slice(0, a.length-(n-1)); touched=true; }\n        }\n      });\n      // an unedited seed must not outlive a correction to the shipped defaults\n      ['components','agreeRows','chang urn (L.agreeRows||[]).slice();\n    if(key==='changeRows'){ const q=(this.fuQs()||[]).find(x=>x.id==='q7'); return q&&q.o?q.o.slice():null; }\n    if(key==='contribRows'){ const q=(this.fuQs()||[]).find(x=>x.id==='q8'); return q&&q.r?q.r.slice():null; }\n    return null;\n  }\n  addTo(key,cap){ this.mutList(key,a=>{ if(cap&&a.length>=cap) return a; a.push(''); return a; }); }\n  removeAt(key,i){ this.mutList(key,a=>{ if(a.length<=1) return a; a.splice(i,1); return a; }); }\n  mutList(key,fn){\n    const t=this.state.tpl;\n    this.setState(prev=>{\n      const by=Object.assign({},prev.byTpl||{});\n      const cur=by[t]||this.blank(t);\n      const st0=Object.assign({},cur);\n      const cfg=Object.assign({},st0.cfg||{});\n      const L=TXT[this.state.lang]||TXT.en;\n      const seed=(k)=>this.seedFor(k);\n      // no pruning here — it would strip the blank row the previous add() created,\n      // leaving the list stuck at \"n real + one blank\". Pruning belongs on the read path.\n      let base=this.asList(cfg[key]);\n      if(!base.filter(x=>String(x).trim()).length){ const sd=seed(key); if(sd&&sd.length){ base=sd.slice();\n        // remember WHAT was seeded: lets a later build refresh an untouched seed\n        cfg['__seed_'+key]=JSON.stringify(sd); } }\n      cfg[key]=fn(base);\n      st0.cfg=cfg; by[t]=st0;\n      return {byTpl:by};\n    }, ()=>{ try{ localStorage.setItem('vlab-build-assistant', JSON.stringify({\n        tpl:this.state.tpl, platform:this.state.platform, lang:this.state.lang,\n        byTpl:this.state.byTpl, orgLogo:this.state.orgLogo||null })); }catch(e){} });\n  }\n\n  setList(key,i,v){ this.mutList(key,a=>{ const b=a.slice(); b[i]=v; return b; }); }\n\n  rowsFor(id){\n    if(this.state.tpl==='followup' && id==='q8'){ const e=this.listOf('contribRows'); if(e.length) return e; }\n    if(this.state.tpl==='followup'){\n      const q=this.fuQs().find(x=>x.id===id); if(!q) return null;\n      if(q.r && q.r.length) return q.r;\n      if(q.ty==='gri
