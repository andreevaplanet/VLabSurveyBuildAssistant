able échelle linéaire de 0 à 10, des grilles à choix multiples et un embranchement par question. Rien dans le socle n’a besoin d’être adapté, et une colonne « Sans objet » peut être ajoutée à n’importe quelle grille.'},\n     {h:'L’embranchement se règle sur la question',t:'Ouvrez le menu à trois points de la question de consentement et choisissez « Accéder à la section en fonction de la réponse ». Oui mène à la section de contact, Non à « Envoyer le formulaire ».'},\n     {h:'Vérifiez explicitement les paramètres de réponse',t:'Dans Paramètres → Réponses, laissez « Collecter les adresses e-mail » et « Limiter à 1 réponse » désactivés. Le second exige une connexion Google et exclut les participants dont l’institution restreint les comptes externes.'}]},\n  msforms:{ types:{single:'Choix, réponse unique',dropdown:'Choix — puis activez « Liste déroulante » dans le menu « … » de la question',multi:'Choix, avec « Réponses multiples » activé',nps:'Évaluation, 10 niveaux',grid:'Likert',short:'Texte, réponse courte',long:'Texte — activez « Réponse longue »',email:'Texte, avec une restriction Texte → E-mail'},\n    grid:'Choisissez Ajouter nouveau → Likert. L’échelle va dans « Options » et les affirmations dans « Instructions », une par ligne.',\n    caveats:[{h:'Les échelles d’évaluation commencent à 1, non à 0',t:'C5 perd son véritable zéro. Acceptez une échelle décalée en le signalant dans votre rapport, ou saisissez les onze niveaux comme options explicites (de 10 à 1) pour conserver le libellé des extrémités. Dans tous les cas, consignez votre choix : un score de recommandation calculé sur 1–10 n’est pas comparable à un score calculé sur 0–10 sans mention de cette différence.'},\n     {h:'L’embranchement se règle sur la section, non sur la question',t:'Ouvrez la section de suivi → « … » → Embranchement, et définissez-y les deux issues. Le réglage sur la question elle-même n’est pas possible.'},\n     {h:'Likert n’offre pas de « sans objet » par ligne',t:'Ajoutez-le comme colonne supplémentaire — la formulation du socle le prévoit déjà.'}]},\n  surveymonkey:{ types:{single:'Choix multiple, une seule réponse',dropdown:'Liste déroulante',multi:'Choix multiple, plusieurs réponses autorisées',nps:'Type de question Net Promoter® Score',grid:'Matrice / échelle d’évaluation',short:'Zone de texte simple',long:'Zone de commentaire',email:'Zone de texte simple, avec validation d’adresse e-mail'},\n    grid:'Utilisez Matrice / échelle d’évaluation. Les lignes sont vos affirmations, les colonnes l’échelle.',\n    caveats:[{h:'Utilisez la question NPS native pour C5',t:'SurveyMonkey propose une question Net Promoter Score dédiée, sur une véritable échelle de 0 à 10. Préférez-la à une évaluation générique : elle fournit la bonne échelle et calcule le score pour vous.'},\n     {h:'La logique de saut se règle par question',t:'Réglez-la sur la question de consentement au suivi : une réponse mène à la page de contact, l’autre saute à la fin de l’enquête.'},\n     {h:'Vérifiez votre formule pour les questions matricielles',t:'Les matrices et la logique de saut ne sont pas incluses dans toutes les formules. À défaut, scindez chaque grille en questions à choix unique partageant la même échelle : les indicateurs restent calculables, mais l’enquête s’allonge de plusieurs questions.'}]},\n  limesurvey:{ types:{single:'Liste (boutons radio)',dropdown:'Liste (déroulante)',multi:'Choix multiple',nps:'Saisie numérique, ou tableau de 0 à 10',grid:'Tableau (array)',short:'Texte libre court',long:'Texte libre long',email:'Texte libre court, avec une expression de validation d’e-mail'},\n    grid:'Utilisez une question Tableau. Les sous-questions sont vos affirmations, les options de réponse l’échelle.',\n    caveats:[{h:'Prend en charge la spécification sans compromis',t:'LimeSurvey gère une véritable échelle de 0 à 10, des tableaux avec colonne « sans objet » et des conditions par question. Rien dans le socle n’a besoin d’être adapté.'},\n     {h:'Activez explicitement les réponses anonymes',t:'Paramètres de l’enquête → Paramètres des participants → Réponses anonymes : Oui. Sans cela, les invitations par jeton peuvent relier les réponses aux personnes, ce qui contredit la déclaration de confidentialité que vous venez de publier.'},\n     {h:'L’auto-hébergement est ici un atout',t:'Pour les Centres dont l’institution restreint le traitement externe des données, un LimeSurvey auto-hébergé conserve les réponses entièrement en interne. À signaler à votre délégué à la protection des données comme l’option la moins contraignante.'}]},\n  typeform:{ types:{single:'Choix multiple',dropdown:'Liste déroulante',multi:'Choix multiple, sélection multiple autorisée',nps:'Échelle d’opinion, de 0 à 10, ou bloc NPS',grid:'Matrice — ou scinder en questions d’échelle d’opinion distinctes',short:'Texte court',long:'Texte long',email:'E-mail'},\n    grid:'La matrice est disponible dans les formules supérieures. À défaut, scindez la grille en questions d’échelle d’opinion partageant une même échelle.',\n    caveats:[{h:'Une question par écran change la perception',t:'Typeform affiche les questions une à une. Une enquête de 17 questions paraît donc plus longue que la même enquête dans un outil paginé, sans l’être réellement. Annoncez le nombre de questions dès le départ pour compenser.'},\n     {h:'La matrice n’est peut-être pas incluse dans votre formule',t:'Sans elle, les quatre grilles deviennent une petite vingtaine de questions distinctes. Le coût est réel : demandez-vous si un autre outil ne servirait pas mieux cet instrument.'},\n     {h:'L’échelle d’opinion accepte bien 0–10',t:'Bonne nouvelle pour C5 : réglez la plage sur 0–10 et nommez les extrémités. Le score de recommandation reste comparable à l’échelle du réseau.'}]},\n  generic:{ types:{single:'Question à choix unique',dropdown:'Liste déroulante ou choix unique',multi:'Question à sélection multiple',nps:'Échelle numérique de 0 à 10',grid:'Question en grille, matrice ou tableau',short:'Champ de texte court',long:'Champ de texte long',email:'Champ de texte court, validé comme adresse e-mail'},\n    grid:'Les lignes sont les affirmations, les colonnes l’échelle. Si votre outil n’a pas de type grille, scindez en questions distinctes partageant une même échelle.',\n    caveats:[{h:'Trois éléments à préserver avant tout',t:'Une véritable plage de 0 à 10 pour C5 ; des lignes et une échelle identiques pour C7 et C8, puisque l’indicateur de progression est la différence entre les deux ; et un seul embranchement, sur la question de consentement. Tout le reste peut s’adapter.'},\n     {h:'L’anonymat est un réglage, non une intention',t:'Quel que soit l’outil, vérifiez qu’il n’enregistre ni noms, ni adresses IP, ni identifiants en regard des réponses. Vous avez promis la confidentialité dans l’introduction.'},\n     {h:'Le papier fonctionne',t:'Pour les activités où la connectivité est mauvaise, cet instrument fonctionne sur papier. Imprimez-le, recueillez-le à la fin de la dernière séance — les taux de réponse y sont généralement bien supérieurs — puis saisissez les résultats dans un tableur.'}]}\n },\n ru:{\n  googleforms:{ types:{single:'Один из списка',dropdown:'Раскрывающийся список',multi:'Несколько из списка',nps:'Линейная шкала, от 0 до 10',grid:'Сетка с одиночным выбором',short:'Короткий ответ',long:'Абзац',email:'Короткий ответ с проверкой ввода «Электронная почта»'},\n    grid:'Используйте сетку с одиночным выбором. Строки — ваши утверждения, столбцы — шкала.',\n    caveats:[{h:'Полностью соответствует спецификации',t:'Google Forms поддерживает настоящую линейную шкалу от 0 до 10, сетки с одиночным выбором и ветвление по каждому вопросу. Ничего в базовой части менять не требуется, а столбец «Не применимо» можно добавить к любой сетке.'},\n     {h:'Ветвление задаётся на уровне вопроса',t:'Откройте меню из трёх точек у вопроса о согласии и выберите «Перейти к разделу в зависимости от ответа». «Да» ведёт к разделу с контактными данными, «Нет» — к «Отправить форму».'},\n     {h:'Проверьте настройки ответов явным образом',t:'В разделе «Настройки → Ответы» оставьте параметры «Собирать адреса электронной почты» и «Не более одного ответа» отключёнными. Второй требует входа в аккаунт Google и исключает участников, чьи организации ограничивают внешние учётные записи.'}]},\n  msforms:{ types:{single:'Выбор, один ответ',dropdown:'Выбор — затем включите «Раскрывающийся список» в меню «…» вопроса',multi:'Выбор с включённым параметром «Несколько ответов»',nps:'Оценка, 10 уровней',grid:'Шкала Лайкерта',short:'Текст, короткий ответ',long:'Текст — включите «Развёрнутый ответ»',email:'Текст с ограничением «Текст → Электронная почта»'},\n    grid:'Выберите «Добавить новый → Шкала Лайкерта». Шкала указывается в поле «Варианты», а утверждения — в поле «Инструкции», по одному на строку.',\n    caveats:[{h:'Шкалы оценки начинаются с 1, а не с 0',t:'Вопрос C5 теряет настоящий ноль. Либо примите смещённую шкалу, указав это в отчёте, либо введите одиннадцать уровней как отдельные варианты ответа (от 10 до 1), сохранив формулировки крайних значений. В любом случае зафиксируйте выбор: индекс потребительской лояльности, рассчитанный по шкале 1–10, несопоставим с рассчитанным по шкале 0–10, если различие не указано.'},\n     {h:'Ветвление задаётся на уровне раздела, а не вопроса',t:'Откройте раздел о повторном опросе → «…» → «Ветвление» и задайте оба исхода там. Настроить его на самом вопросе невозможно.'},\n     {h:'В шкале Лайкерта нет варианта «не применимо» для строки',t:'Добавьте его как дополнительный столбец — формулировки базовой части это уже предполагают.'}]},\n  surveymonkey:{ types:{single:'Множественный выбор, один ответ',dropdown:'Раскрывающийся список',multi:'Множественный выбор с несколькими ответами',nps:'Тип вопроса Net Promoter® Score',grid:'Матрица / шкала оценки',short:'Одиночное текстовое поле',long:'Поле для комментария',email:'Одиночное текстовое поле с проверкой адреса'},\n    grid:'Используйте «Матрица / шкала оценки». Строки — ваши утверждения, столбцы — шкала.',\n    caveats:[{h:'Для C5 используйте встроенный вопрос NPS',t:'В SurveyMonkey есть специальный вопрос Net Promoter Score с настоящей шкалой от 0 до 10. Используйте его вместо обычной оценки: он даёт правильную шкалу и сам рассчитывает индекс.'},\n     {h:'Логика переходов задаётся для каждого вопроса',t:'Задайте её для вопроса о согласии на повторный опрос: один ответ ведёт к странице контактов, другой — к завершению анкеты.'},\n     {h:'Проверьте, входят ли матричные вопросы в ваш тарифный план',t:'Матричные вопросы и логика переходов доступны не во всех тарифах. Если их нет, разбейте каждую сетку на отдельные вопросы с одиночным выбором и одинаковой шкалой: показатели по-прежнему рассчитываются, но анкета удлиняется на несколько вопросов.'}]},\n  limesurvey:{ types:{single:'Список (переключатели)',dropdown:'Список (раскрывающийся)',multi:'Множественный выбор',nps:'Числовой ввод либо массив от 0 до 10',grid:'Массив (array)',short:'Короткий свободный текст',long:'Длинный свободный текст',email:'Короткий свободный текст с регулярным выражением для проверки адреса'},\n    grid:'Используйте вопрос типа «Массив». Подвопросы — ваши утверждения, варианты ответа — шкала.',\n    caveats:[{h:'Полностью соответствует спецификации',t:'LimeSurvey поддерживает настоящую шкалу от 0 до 10, массивы со столбцом «не применимо» и условия для отдельных вопросов. Ничего в базовой части менять не требуется.'},\n     {h:'Анонимность ответов включается явным образом',t:'«Настройки анкеты → Настройки участников → Анонимные ответы: Да». Иначе приглашения с токенами позволяют связать ответы с конкретными людьми, что противоречит только что опубликованному заявлению о конфиденциальности.'},\n     {h:'Здесь размещение на своих серверах — преимущество',t:'Для Центров, чьи организации ограничивают обработку данных вне своей инфраструктуры, LimeSurvey на собственном сервере полностью сохраняет ответы внутри организации. Стоит указать это специалисту по защите данных как наименее проблемный вариант.'}]},\n  typeform:{ types:{single:'Множественный выбор',dropdown:'Раскрывающийся список',multi:'Множественный выбор с возможностью нескольких ответов',nps:'Шкала мнений от 0 до 10 либо блок NPS',grid:'Матрица — либо разбиение на отдельные вопросы со шкалой мнений',short:'Короткий текст',long:'Длинный текст',email:'Электронная почта'},\n    grid:'Матрица доступна в более дорогих тарифах. Если её нет, разбейте сетку на отдельные вопросы со шкалой мнений и единой шкалой.',\n    caveats:[{h:'По одному вопросу на экран меняет восприятие',t:'Typeform показывает вопросы по одному. Поэтому анкета из 17 вопросов кажется длиннее той же анкеты в постраничном инструменте, хотя это не так. Чтобы компенсировать это, сообщите число вопросов заранее.'},\n     {h:'Матрица может не входить в ваш тариф',t:'Без неё четыре сетки превращаются примерно в восемнадцать отдельных вопросов. Это существенные издержки — подумайте, не подойдёт ли для этой анкеты другой инструмент.'},\n     {h:'Шкала мнений действительно поддерживает 0–10',t:'Хорошая новость для C5: задайте диапазон 0–10 и подпишите крайние значения. Индекс лояльности останется сопоставимым в масштабах сети.'}]},\n  generic:{ types:{single:'Вопрос с одним вариантом ответа',dropdown:'Раскрывающийся список или один вариант',multi:'Вопрос с несколькими вариантами ответа',nps:'Числовая шкала от 0 до 10',grid:'Вопрос в виде сетки, матрицы или массива',short:'Короткое текстовое поле',long:'Длинное текстовое поле',email:'Короткое текстовое поле с проверкой адреса'},\n    grid:'Строки — утверждения, столбцы — шкала. Если в вашем инструменте нет табличного типа, разбейте вопрос на отдельные с единой шкалой.',\n    caveats:[{h:'Три вещи, которые следует сохранить прежде всего',t:'Настоящий диапазон от 0 до 10 в C5; полностью совпадающие строки и шкала в C7 и C8, поскольку показатель прироста знаний — это разница между ними; и единственное ветвление на вопросе о согласии. Всё остальное можно адаптировать.'},\n     {h:'Анонимность — это настройка, а не намерение',t:'Каким бы инструментом вы ни пользовались, убедитесь, что он не сохраняет имена, IP-адреса или данные входа рядом с ответами. Во вступлении вы обещали конфиденциальность.'},\n     {h:'Бумага работает',t:'Для мероприятий с плохой связью этот инструмент работает и на бумаге. Распечатайте его, соберите по завершении последнего занятия — доля ответов там обычно значительно выше — и внесите результаты в электронную таблицу.'}]}\n },\n zh:{\n  googleforms:{ types:{single:'单选',dropdown:'下拉列表',multi:'复选框',nps:'线性量表，0 至 10',grid:'单选网格',short:'简短回答',long:'段落',email:'简短回答，并将回复验证设为“电子邮件地址”'},\n    grid:'请使用单选网格。行为您的陈述，列为量表。',\n    caveats:[{h:'完全符合规范，无需折衷',t:'Google Forms 提供真正的 0 至 10 线性量表、单选网格以及按题分支。核心部分无需任何调整，且可为任一网格增设“不适用”一列。'},\n     {h:'分支在题目层级设置',t:'点开同意题右下角的三点菜单，选择“根据答案转到相应版块”。选“是”转到联系方式版块；选“否”转到“提交表单”。'},\n     {h:'请明确检查回复设置',t:'在“设置 → 回复”中，将“收集电子邮件地址”和“限制为 1 次回复”均保持关闭。后者要求登录 Google 账号，会把所在机构限制外部账号的参加者排除在外。'}]},\n  msforms:{ types:{single:'选择题，单选',dropdown:'选择题——再从题目“…”菜单中启用“下拉列表”',multi:'选择题，并启用“多选”',nps:'评分，10 级',grid:'李克特量表',short:'文本，简短回答',long:'文本——启用“长答案”',email:'文本，并添加“文本 → 电子邮件”限制'},\n    grid:'选择“添加新问题 → 李克特量表”。量表填入“选项”，陈述填入“说明”，每行一条。',\n    caveats:[{h:'评分量表从 1 开始，而非 0',t:'C5 因此失去真正的零点。您可以接受偏移量表并在报告中加以说明，或将十一个等级作为显式选项（10 至 1）输入，以保留两端的措辞。无论选择哪种，都请记录在案：以 1–10 计算的净推荐值，若不说明差异，便无法与以 0–10 计算的结果相比较。'},\n     {h:'分支位于分节层级，而非题目层级',t:'打开跟进分节 →“…”→“分支”，在此设定两种走向。无法在题目本身设置。'},\n     {h:'李克特量表不支持按行的“不适用”',t:'请将其增设为一列——核心措辞已按此假定编写。'}]},\n  surveymonkey:{ types:{single:'单选题，仅一个答案',dropdown:'下拉列表',multi:'单选题，允许多个答案',nps:'Net Promoter® Score 题型',grid:'矩阵／评分量表',short:'单行文本框',long:'评论框',email:'单行文本框，并启用邮箱验证'},\n    grid:'请使用矩阵／评分量表。行为您的陈述，列为量表。',\n    caveats:[{h:'C5 请使用原生 NPS 题型',t:'SurveyMonkey 设有专用的净推荐值题型，采用真正的 0 至 10 量表。请优先使用它而非通用评分：它既给出正确量表，也会自动为您计算得分。'},\n     {h:'跳转逻辑按题设置',t:'请在跟进同意题上设置：一个答案继续进入联系方式页面，另一个跳至问卷末尾。'},\n     {h:'请确认您的套餐是否包含矩阵题',t:'矩阵题与跳转逻辑并非所有套餐都提供。若无法使用，可将每个网格拆成量表相同的单选题：各项指标仍可计算，但问卷会增加若干题。'}]},\n  limesurvey:{ types:{single:'列表（单选按钮）',dropdown:'列表（下拉）',multi:'多选',nps:'数值输入，或 0 至 10 的数组题',grid:'数组题（array）',short:'短文本',long:'长文本',email:'短文本，并配邮箱验证正则'},\n    grid:'请使用数组题。子问题为您的陈述，答案选项为量表。',\n    caveats:[{h:'完全符合规范，无需折衷',t:'LimeSurvey 支持真正的 0 至 10 量表、带“不适用”列的数组题以及按题条件。核心部分无需任何调整。'},\n     {h:'请明确启用匿名回复',t:'“问卷设置 → 参加者设置 → 匿名回复：是”。否则基于令牌的邀请可能将答案与个人关联，这与您刚刚公布的保密声明相矛盾。'},\n     {h:'此处自行托管是一项优势',t:'对于所在机构限制外部数据处理的中心，自行托管的 LimeSurvey 可将回复完全保留在机构内部。不妨向贵机构的数据保护负责人说明，这是阻力最小的方案。'}]},\n  typeform:{ types:{single:'单选题',dropdown:'下拉列表',multi:'单选题，允许多选',nps:'观点量表，0 至 10，或 NPS 模块',grid:'矩阵——或拆分为独立的观点量表题',short:'短文本',long:'长文本',email:'电子邮箱'},\n    grid:'矩阵功能见于较高级套餐。若无此功能，请将网格拆分为共用同一量表的观点量表题。',\n    caveats:[{h:'每屏一题会改变观感',t:'Typeform 逐题呈现。因此 17 题的问卷会显得比同样题量的分页式问卷更长，实际并非如此。可在开头告知题目总数以作抵消。'},\n     {h:'您的套餐可能不含矩阵功能',t:'若无矩阵，四道网格题将变成约十八道独立题目。这是实实在在的代价——请考虑是否有别的工具更适合本问卷。'},\n     {h:'观点量表确实支持 0–10',t:'对 C5 是好消息：将区间设为 0–10 并标注两端即可。净推荐值在全网范围内仍可比较。'}]},\n  generic:{ types:{single:'单选题',dropdown:'下拉列表或单选列表',multi:'多选题',nps:'0 至 10 的数值量表',grid:'网格、矩阵或数组题',short:'短文本字段',long:'长文本字段',email:'短文本字段，并验证为电子邮箱'},\n    grid:'行为陈述，列为量表。若您的工具没有网格题型，请拆分为共用同一量表的独立题目。',\n    caveats:[{h:'首要须保留的三点',t:'C5 须为真正的 0 至 10 区间；C7 与 C8 的行与量表须完全一致，因为学习增益指标即两者之差；同意题上须仅有一处分支。其余均可灵活调整。'},\n     {h:'匿名是一项设置，而非一种意愿',t:'无论使用何种工具，都请确认它未将姓名、IP 地址或登录信息与答案一并记录。您已在引言中承诺保密。'},\n     {h:'纸质问卷同样可行',t:'对于网络条件较差的活动，本问卷可用纸质形式。打印后于最后一场结束时回收——回收率通常远高于线上——再将结果录入电子表格。'}]}\n },\n es:{\n  googleforms:{ types:{single:'Varias opciones',dropdown:'Lista desplegable',multi:'Casillas de verificación',nps:'Escala lineal, de 0 a 10',grid:'Cuadrícula de varias opciones',short:'Respuesta corta',long:'Párrafo',email:'Respuesta corta, con validación establecida en Dirección de correo'},\n    grid:'Use una cuadrícula de varias opciones. Las filas son sus afirmaciones y las columnas, la escala.',\n    caveats:[{h:'Admite la especificación sin concesiones',t:'Google Forms ofrece una escala lineal real de 0 a 10, cuadrículas de varias opciones y bifurcación por pregunta. Nada del núcleo necesita adaptarse, y puede añadirse una columna «No procede» a cualquier cuadrícula.'},\n     {h:'La bifurcación se define en la pregunta',t:'Abra el menú de tres puntos en la pregunta de consentimiento y elija «Ir a la sección según la respuesta». Sí lleva a la sección de contacto; No, a «Enviar formulario».'},\n     {h:'Revise explícitamente los ajustes de respuesta',t:'En Configuración → Respuestas, deje desactivadas «Recopilar direcciones de correo» y «Limitar a 1 respuesta». La segunda exige iniciar sesión con Google y excluye a participantes cuyas instituciones restringen las cuentas externas.'}]},\n  msforms:{ types:{single:'Opción, respuesta única',dropdown:'Opción — luego active «Lista desplegable» en el menú «…» de la pregunta',multi:'Opción, con «Varias respuestas» activado',nps:'Clasificación, 10 niveles',grid:'Likert',short:'Texto, respuesta corta',long:'Texto — active «Respuesta larga»',email:'Texto, con una restricción de Texto → Correo electrónico'},\n    grid:'Elija Agregar nuevo → Likert. La escala va en «Opciones» y las afirmaciones en «Instrucciones», una por línea.',\n    caveats:[{h:'Las escalas de clasificación empiezan en 1, no en 0',t:'C5 pierde su cero real. Acepte una escala desplazada indicándolo en su informe, o introduzca los once niveles como opciones explícitas (de 10 a 1) para conservar la redacción de los extremos. En cualquier caso, deje constancia: un índice de recomendación calculado sobre 1–10 no es comparable con uno calculado sobre 0–10 si no se señala la diferencia.'},\n     {h:'La bifurcación reside en la sección, no en la pregunta',t:'Abra la sección de seguimiento → «…» → Bifurcación y defina allí los dos resultados. No es posible configurarla en la pregunta misma.'},\n     {h:'Likert no admite «no procede» por fila',t:'Añádalo como columna adicional: la redacción del núcleo ya lo prevé.'}]},\n  surveymonkey:{ types:{single:'Varias opciones, una respuesta',dropdown:'Lista desplegable',multi:'Varias opciones, admitiendo respuestas múltiples',nps:'Tipo de pregunta Net Promoter® Score',grid:'Matriz / escala de valoración',short:'Cuadro de texto simple',long:'Cuadro de comentarios',email:'Cuadro de texto simple, con validación de correo'},\n    grid:'Use Matriz / escala de valoración. Las filas son sus afirmaciones y las columnas, la escala.',\n    caveats:[{h:'Use la pregunta NPS nativa para C5',t:'SurveyMonkey tiene una pregunta Net Promoter Score específica, con una escala real de 0 a 10. Úsela en lugar de una valoración genérica: le da la escala correcta y calcula el índice por usted.'},\n     {h:'La lógica de salto se define por pregunta',t:'Configúrela en la pregunta de consentimiento al seguimiento: una respuesta continúa a la página de contacto y la otra salta al final de la encuesta.'},\n     {h:'Compruebe su plan para las preguntas matriciales',t:'Las matrices y la lógica de salto no están en todos los planes. Si no dispone de ellas, divida cada cuadrícula en preguntas de opción única con la misma escala: los indicadores siguen calculándose, pero la encuesta crece en varias preguntas.'}]},\n  limesurvey:{ types:{single:'Lista (botones de opción)',dropdown:'Lista (desplegable)',multi:'Opción múltiple',nps:'Entrada numérica, o matriz de 0 a 10',grid:'Matriz (array)',short:'Texto libre corto',long:'Texto libre largo',email:'Texto libre corto, con expresión de validación de correo'},\n    grid:'Use una pregunta de tipo Matriz. Las subpreguntas son sus afirmaciones y las opciones de respuesta, la escala.',\n    caveats:[{h:'Admite la especificación sin concesiones',t:'LimeSurvey admite una escala real de 0 a 10, matrices con columna «no procede» y condiciones por pregunta. Nada del núcleo necesita adaptarse.'},\n     {h:'Active explícitamente las respuestas anónimas',t:'Configuración de la encuesta → Ajustes de participantes → Respuestas anonimizadas: Sí. De lo contrario, las invitaciones con token pueden vincular las respuestas a personas concretas, lo que contradice la declaración de confidencialidad que acaba de publicar.'},\n     {h:'El alojamiento propio es aquí una ventaja',t:'Para los Centros cuyas instituciones restringen el tratamiento externo de datos, un LimeSurvey alojado internamente mantiene las respuestas por completo dentro de la institución. Conviene señalarlo a su responsable de protección de datos como la opción de menor fricción.'}]},\n  typeform:{ types:{single:'Varias opciones',dropdown:'Lista desplegable',multi:'Varias opciones, con selección múltiple permitida',nps:'Escala de opinión, de 0 a 10, o bloque NPS',grid:'Matriz — o dividir en preguntas de escala de opinión independientes',short:'Texto corto',long:'Texto largo',email:'Correo electrónico'},\n    grid:'La matriz está disponible en los planes superiores. Si no dispone de ella, divida la cuadrícula en preguntas de escala de opinión que compartan una misma escala.',\n    caveats:[{h:'Una pregunta por pantalla cambia la percepción',t:'Typeform muestra las preguntas de una en una. Una encuesta de 17 preguntas parece por ello más larga que la misma encuesta en una herramienta paginada, aunque no lo sea. Indique el número de preguntas de entrada para compensarlo.'},\n     {h:'Puede que la matriz no esté en su plan',t:'Sin ella, las cuatro cuadrículas se convierten en unas dieciocho preguntas independientes. El coste es real: valore si otra herramienta serviría mejor para este instrumento.'},\n     {h:'La escala de opinión sí admite 0–10',t:'Buena noticia para C5: fije el intervalo en 0–10 y etiquete los extremos. El índice de recomendación se mantiene comparable en toda la red.'}]},\n  generic:{ types:{single:'Pregunta de opción única',dropdown:'Lista desplegable o de opción única',multi:'Pregunta de selección múltiple',nps:'Escala numérica de 0 a 10',grid:'Pregunta de cuadrícula, matriz o array',short:'Campo de texto corto',long:'Campo de texto largo',email:'Campo de texto corto, validado como dirección de correo'},\n    grid:'Las filas son las afirmaciones y las columnas, la escala. Si su herramienta no tiene tipo cuadrícula, divídala en preguntas independientes que compartan una misma escala.',\n    caveats:[{h:'Tres cosas que conviene preservar por encima de todo',t:'Un intervalo real de 0 a 10 en C5; filas y escala idénticas en C7 y C8, ya que el indicador de progreso es la diferencia entre ambas; y una sola bifurcación, en la pregunta de consentimiento. Todo lo demás puede adaptarse.'},\n     {h:'El anonimato es un ajuste, no una intención',t:'Cualquiera que sea la herramienta, compruebe que no registra nombres, direcciones IP ni inicios de sesión junto a las respuestas. Ha prometido confidencialidad en la introducción.'},\n     {h:'El papel funciona',t:'Para actividades con mala conectividad, este instrumento funciona en papel. Imprímalo, recójalo al cierre de la última sesión —las tasas de respuesta suelen ser mucho más altas— y traslade los resultados a una hoja de cálculo.'}]}\n },\n ar:{\n  googleforms:{ types:{single:'اختيار من متعدد',dropdown:'قائمة منسدلة',multi:'مربعات اختيار',nps:'مقياس خطي، من 0 إلى 10',grid:'شبكة اختيار من متعدد',short:'إجابة قصيرة',long:'فقرة',email:'إجابة قصيرة مع تعيين التحقق على «عنوان بريد إلكتروني»'},\n    grid:'استخدم شبكة اختيار من متعدد. الصفوف هي عباراتك والأعمدة هي المقياس.',\n    caveats:[{h:'يدعم المواصفات دون تنازل',t:'يوفّر Google Forms مقياسًا خطيًا حقيقيًا من 0 إلى 10، وشبكات اختيار من متعدد، وتفرّعًا لكل سؤال. ولا يحتاج أي عنصر من الأسئلة الأساسية إلى تعديل، ويمكن إضافة عمود «لا ينطبق» إلى أي شبكة.'},\n     {h:'يُضبط التفرّع على مستوى السؤال',t:'افتح قائمة النقاط الثلاث في سؤال الموافقة واختر «الانتقال إلى القسم حسب الإجابة». «نعم» تنتقل إلى قسم الاتصال، و«لا» إلى «إرسال النموذج».'},\n     {h:'تحقّق من إعدادات الردود صراحةً',t:'في «الإعدادات ← الردود»، أبقِ خيار «جمع عناوين البريد الإلكتروني» وخيار «تحديد رد واحد» معطّلين. فالثاني يستلزم تسجيل الدخول بحساب Google ويستبعد المشاركين الذين تقيّد مؤسساتهم الحسابات الخارجية.'}]},\n  msforms:{ types:{single:'اختيار، إجابة واحدة',dropdown:'اختيار — ثم فعّل «قائمة منسدلة» من قائمة «…» الخاصة بالسؤال',multi:'اختيار مع تفعيل «إجابات متعددة»',nps:'تقييم، 10 مستويات',grid:'ليكرت',short:'نص، إجابة قصيرة',long:'نص — فعّل «إجابة طويلة»',email:'نص مع قيد «نص ← بريد إلكتروني»'},\n    grid:'اختر «إضافة جديد ← ليكرت». يوضع المقياس في «الخيارات» والعبارات في «التعليمات»، عبارة في كل سطر.',\n    caveats:[{h:'مقاييس التقييم تبدأ من 1 لا من 0',t:'يفقد السؤال C5 صفره الحقيقي. فإما أن تقبل مقياسًا مُزاحًا مع الإشارة إلى ذلك في تقريرك، أو تُدخل المستويات الأحد عشر كخيارات صريحة (من 10 إلى 1) للحفاظ على صياغة الطرفين. وفي الحالتين سجّل ما اخترته: فمؤشر صافي الترويج المحسوب على مقياس 1–10 لا يُقارن بالمحسوب على 0–10 دون بيان هذا الفرق.'},\n     {h:'التفرّع يُضبط على مستوى القسم لا السؤال',t:'افتح قسم المتابعة ← «…» ← التفرّع، وحدّد النتيجتين هناك. ولا يمكن ضبطه على السؤال نفسه.'},\n     {h:'لا يتيح ليكرت خيار «لا ينطبق» لكل صف',t:'أضِفه كعمود إضافي — فصياغة الأسئلة الأساسية تفترض ذلك أصلًا.'}]},\n  surveymonkey:{ types:{single:'اختيار من متعدد، إجابة واحدة',dropdown:'قائمة منسدلة',multi:'اختيار من متعدد بإجابات متعددة',nps:'نوع سؤال Net Promoter® Score',grid:'مصفوفة / مقياس تقييم',short:'مربع نص مفرد',long:'مربع تعليقات',email:'مربع نص مفرد مع التحقق من البريد الإلكتروني'},\n    grid:'استخدم «مصفوفة / مقياس تقييم». الصفوف هي عباراتك والأعمدة هي المقياس.',\n    caveats:[{h:'استخدم سؤال NPS المدمج للسؤال C5',t:'يتضمّن SurveyMonkey سؤالًا مخصّصًا لمؤشر صافي الترويج على مقياس حقيقي من 0 إلى 10. استخدمه بدلًا من تقييم عام: فهو يمنحك المقياس الصحيح ويحسب المؤشر عنك.'},\n     {h:'يُضبط منطق التخطّي لكل سؤال',t:'اضبطه على سؤال الموافقة على المتابعة: إجابة تنتقل إلى صفحة الاتصال، والأخرى تتخطّى إلى نهاية الاستبيان.'},\n     {h:'تحقّق من خطة اشتراكك بشأن أسئلة المصفوفة',t:'أسئلة المصفوفة ومنطق التخطّي غير متاحين في كل الخطط. وإن لم تتوفّر، فقسّم كل شبكة إلى أسئلة اختيار مفرد بالمقياس نفسه: تبقى المؤشرات قابلة للحساب، لكن يطول الاستبيان بعدة أسئلة.'}]},\n  limesurvey:{ types:{single:'قائمة (أزرار اختيار)',dropdown:'قائمة (منسدلة)',multi:'اختيار متعدد',nps:'إدخال رقمي، أو مصفوفة من 0 إلى 10',grid:'مصفوفة (array)',short:'نص حر قصير',long:'نص حر طويل',email:'نص حر قصير مع تعبير للتحقق من البريد الإلكتروني'},\n    grid:'استخدم سؤال المصفوفة. الأسئلة الفرعية هي عباراتك وخيارات الإجابة هي المقياس.',\n    caveats:[{h:'يدعم المواصفات دون تنازل',t:'يدعم LimeSurvey مقياسًا حقيقيًا من 0 إلى 10، ومصفوفات بعمود «لا ينطبق»، وشروطًا لكل سؤال. ولا يحتاج أي عنصر من الأسئلة الأساسية إلى تعديل.'},\n     {h:'فعّل الردود المجهولة صراحةً',t:'«إعدادات الاستبيان ← إعدادات المشاركين ← ردود مجهولة: نعم». وإلا فقد تربط الدعوات المعتمدة على الرموز الإجابات بأصحابها، وهو ما يخالف بيان السرية الذي نشرته للتو.'},\n     {h:'الاستضافة الذاتية ميزة هنا',t:'بالنسبة للمراكز التي تقيّد مؤسساتها معالجة البيانات خارجيًا، يُبقي LimeSurvey المستضاف ذاتيًا الردود داخل المؤسسة بالكامل. ويجدر إبلاغ مسؤول حماية البيانات لديكم بذلك كأقل الخيارات إثارةً للإشكالات.'}]},\n  typeform:{ types:{single:'اختيار من متعدد',dropdown:'قائمة منسدلة',multi:'اختيار من متعدد بتحديد متعدد',nps:'مقياس الرأي من 0 إلى 10، أو كتلة NPS',grid:'مصفوفة — أو التقسيم إلى أسئلة مقياس رأي منفصلة',short:'نص قصير',long:'نص طويل',email:'بريد إلكتروني'},\n    grid:'المصفوفة متاحة في الخطط الأعلى. وإن لم تتوفّر، فقسّم الشبكة إلى أسئلة مقياس رأي تشترك في مقياس واحد.',\n    caveats:[{h:'سؤال واحد في كل شاشة يغيّر الإحساس بالطول',t:'يعرض Typeform الأسئلة واحدًا تلو الآخر. لذا يبدو استبيان من 17 سؤالًا أطول من الاستبيان نفسه في أداة مُصفَّحة، دون أن يكون كذلك فعلًا. اذكر عدد الأسئلة مقدّمًا لتعويض ذلك.'},\n     {h:'قد لا تشمل خطتك المصفوفة',t:'بدونها تتحوّل الشبكات الأربع إلى نحو ثمانية عشر سؤالًا منفصلًا. وهذه كلفة حقيقية — ففكّر فيما إذا كانت أداة أخرى أنسب لهذا الاستبيان.'},\n     {h:'مقياس الرأي يدعم 0–10 فعلًا',t:'خبر سار بشأن C5: اضبط النطاق على 0–10 وسمِّ الطرفين. ويبقى مؤشر صافي الترويج قابلًا للمقارنة على نطاق الشبكة.'}]},\n  generic:{ types:{single:'سؤال باختيار مفرد',dropdown:'قائمة منسدلة أو اختيار مفرد',multi:'سؤال بتحديد متعدد',nps:'مقياس رقمي من 0 إلى 10',grid:'سؤال شبكي أو مصفوفة',short:'حقل نص قصير',long:'حقل نص طويل',email:'حقل نص قصير مع التحقق من صحة البريد الإلكتروني'},\n    grid:'الصفوف هي العبارات والأعمدة هي المقياس. وإن لم يكن في أداتك نوع شبكي، فقسّمها إلى أسئلة منفصلة تشترك في مقياس واحد.',\n    caveats:[{h:'ثلاثة أمور يجب الحفاظ عليها قبل كل شيء',t:'نطاق حقيقي من 0 إلى 10 في C5؛ وصفوف ومقياس متطابقان في C7 وC8، لأن مؤشر المكتسب التعليمي هو الفرق بينهما؛ وتفرّع واحد فقط على سؤال الموافقة. أما ما عدا ذلك فقابل للتعديل.'},\n     {h:'إخفاء الهوية إعداد لا نيّة',t:'أيًّا كانت الأداة، تحقّق من أنها لا تسجّل الأسماء ولا عناوين IP ولا بيانات الدخول مقابل الإجابات. فقد وعدت بالسرية في المقدمة.'},\n     {h:'الورق يفي بالغرض',t:'في الأنشطة ذات الاتصال الضعيف، يعمل هذا الاستبيان على الورق. اطبعه واجمعه في ختام الجلسة الأخيرة — إذ تكون معدلات الرد عادةً أعلى بكثير — ثم أدخِل النتائج في جدول بيانات.'}]}\n },\n pt:{\n  googleforms:{ types:{single:'Múltipla escolha',dropdown:'Lista suspensa',multi:'Caixas de seleção',nps:'Escala linear, de 0 a 10',grid:'Grade de múltipla escolha',short:'Resposta curta',long:'Parágrafo',email:'Resposta curta, com validação definida como Endereço de e-mail'},\n    grid:'Use uma grade de múltipla escolha. As linhas são suas afirmações e as colunas, a escala.',\n    caveats:[{h:'Atende à especificação sem concessões',t:'O Google Forms oferece escala linear real de 0 a 10, grades de múltipla escolha e ramificação por pergunta. Nada do núcleo precisa ser adaptado, e uma coluna \"Não se aplica\" pode ser acrescentada a qualquer grade.'},\n     {h:'A ramificação é definida na pergunta',t:'Abra o menu de três pontos na pergunta de consentimento e escolha \"Ir para a seção com base na resposta\". Sim vai para a seção de contato; Não, para \"Enviar formulário\".'},\n     {h:'Verifique explicitamente as configurações de respostas',t:'Em Configurações → Respostas, deixe \"Coletar endereços de e-mail\" e \"Limitar a 1 resposta\" desativados. A segunda exige login Google e exclui participantes cujas instituições restringem contas externas.'}]},\n  msforms:{ types:{single:'Escolha, resposta única',dropdown:'Escolha — depois ative \"Lista suspensa\" no menu \"…\" da pergunta',multi:'Escolha, com \"Várias respostas\" ativado',nps:'Classificação, 10 níveis',grid:'Likert',short:'Texto, resposta curta',long:'Texto — ative \"Resposta longa\"',email:'Texto, com restrição de Texto → E-mail'},\n    grid:'Escolha Adicionar novo → Likert. A escala vai em \"Opções\" e as afirmações em \"Instruções\", uma por linha.',\n    caveats:[{h:'As escalas de classificação começam em 1, não em 0',t:'A C5 perde o zero verdadeiro. Aceite uma escala deslocada registrando isso no relatório, ou insira os onze níveis como opções explícitas (de 10 a 1) para preservar a redação dos extremos. Em qualquer caso, registre a escolha: um índice de recomendação calculado em 1–10 não é comparável a um calculado em 0–10 sem que a diferença seja declarada.'},\n     {h:'A ramificação fica na seção, não na pergunta',t:'Abra a seção de acompanhamento → \"…\" → Ramificação e defina ali os dois desfechos. Não é possível configurá-la na própria pergunta.'},\n     {h:'O Likert não oferece \"não se aplica\" por linha',t:'Acrescente-o como coluna adicional — a redação do núcleo já pressupõe isso.'}]},\n  surveymonkey:{ types:{single:'Múltipla escolha, uma resposta',dropdown:'Lista suspensa',multi:'Múltipla escolha, permitindo várias respostas',nps:'Tipo de pergunta Net Promoter® Score',grid:'Matriz / escala de avaliação',short:'Caixa de texto simples',long:'Caixa de comentário',email:'Caixa de texto simples, com validação de e-mail'},\n    grid:'Use Matriz / escala de avaliação. As linhas são suas afirmações e as colunas, a escala.',\n    caveats:[{h:'Use a pergunta NPS nativa para a C5',t:'O SurveyMonkey tem uma pergunta Net Promoter Score própria, em escala real de 0 a 10. Use-a em vez de uma avaliação genérica: ela fornece a escala correta e calcula o índice para você.'},\n     {h:'A lógica de salto é definida por pergunta',t:'Defina-a na pergunta de consentimento ao acompanhamento: uma resposta segue para a página de contato e a outra salta para o fim do questionário.'},\n     {h:'Confira seu plano quanto a perguntas matriciais',t:'Matrizes e lógica de salto não estão em todos os planos. Se não estiverem disponíveis, divida cada grade em perguntas de escolha única com a mesma escala: os indicadores continuam calculáveis, mas o questionário cresce algumas perguntas.'}]},\n  limesurvey:{ types:{single:'Lista (botões de opção)',dropdown:'Lista (suspensa)',multi:'Múltipla escolha',nps:'Entrada numérica, ou matriz de 0 a 10',grid:'Matriz (array)',short:'Texto livre curto',long:'Texto livre longo',email:'Texto livre curto, com expressão de validação de e-mail'},\n    grid:'Use uma pergunta do tipo Matriz. As subperguntas são suas afirmações e as opções de resposta, a escala.',\n    caveats:[{h:'Atende à especificação sem concessões',t:'O LimeSurvey admite escala real de 0 a 10, matrizes com coluna \"não se aplica\" e condições por pergunta. Nada do núcleo precisa ser adaptado.'},\n     {h:'Ative explicitamente as respostas anônimas',t:'Configurações do questionário → Configurações de participantes → Respostas anonimizadas: Sim. Caso contrário, convites com token podem vincular respostas a pessoas, o que contradiz a declaração de confidencialidade que você acabou de publicar.'},\n     {h:'Aqui a hospedagem própria é uma vantagem',t:'Para Centros cujas instituições restringem o tratamento externo de dados, um LimeSurvey hospedado internamente mantém as respostas inteiramente dentro da instituição. Vale sinalizar isso ao encarregado de proteção de dados como a opção de menor atrito.'}]},\n  typeform:{ types:{single:'Múltipla escolha',dropdown:'Lista suspensa',multi:'Múltipla escolha, com seleção múltipla permitida',nps:'Escala de opinião, de 0 a 10, ou bloco NPS',grid:'Matriz — ou dividir em perguntas de escala de opinião separadas',short:'Texto curto',long:'Texto longo',email:'E-mail'},\n    grid:'A matriz está disponível nos planos superiores. Se não a tiver, divida a grade em perguntas de escala de opinião que compartilhem uma mesma escala.',\n    caveats:[{h:'Uma pergunta por tela altera a percepção',t:'O Typeform mostra as perguntas uma a uma. Um questionário de 17 perguntas parece, por isso, mais longo que o mesmo questionário em uma ferramenta paginada, embora não seja. Informe o número de perguntas no início para compensar.'},\n     {h:'A matriz pode não estar no seu plano',t:'Sem ela, as quatro grades tornam-se cerca de dezoito perguntas separadas. O custo é real: avalie se outra ferramenta serviria melhor a este instrumento.'},\n     {h:'A escala de opinião aceita 0–10',t:'Boa notícia para a C5: defina o intervalo em 0–10 e rotule os extremos. O índice de recomendação permanece comparável em toda a rede.'}]},\n  generic:{ types:{single:'Pergunta de escolha única',dropdown:'Lista suspensa ou de escolha única',multi:'Pergunta de seleção múltipla',nps:'Escala numérica de 0 a 10',grid:'Pergunta em grade, matriz ou array',short:'Campo de texto curto',long:'Campo de texto longo',email:'Campo de texto curto, validado como endereço de e-mail'},\n    grid:'As linhas são as afirmações e as colunas, a escala. Se sua ferramenta não tiver tipo grade, divida em perguntas separadas que compartilhem uma mesma escala.',\n    caveats:[{h:'Três coisas a preservar acima de tudo',t:'Um intervalo real de 0 a 10 na C5; linhas e escala idênticas na C7 e na C8, já que o indicador de ganho é a diferença entre as duas; e uma única ramificação, na pergunta de consentimento. Todo o resto pode ceder.'},\n     {h:'Anonimato é uma configuração, não uma intenção',t:'Qualquer que seja a ferramenta, verifique se ela não está registrando nomes, endereços IP ou logins junto às respostas. Você prometeu confidencialidade na introdução.'},\n     {h:'Papel funciona',t:'Para atividades com conectividade M–CGMS pour l’enseignement et la formation en météorologie satellitaire.\\n\\nCe questionnaire prend environ 9 minutes et porte sur une seule question : ce que vous avez pu faire de ce que vous avez appris. Les réponses négatives nous sont aussi utiles que les positives — si rien n’a été appliqué, nous avons besoin de savoir ce qui a fait obstacle.\\n\\nLes réponses sont confidentielles et présentées uniquement de façon agrégée. Merci de répondre avant le {deadline}.',\n es:'Hace unos meses participó en la actividad de formación «{title}», impartida {dates} por {org} — {centre}, en el marco del Laboratorio Virtual OMM–CGMS para la Enseñanza y la Formación en Meteorología Satelital.\\n\\nEste cuestionario lleva unos 9 minutos y pregunta una sola cosa: qué ha podido hacer con lo aprendido. Las respuestas negativas nos resultan tan útiles como las positivas: si no se aplicó nada, necesitamos saber qué lo impidió.\\n\\nLas respuestas son confidenciales y se presentan únicamente de forma agregada. Le rogamos que responda antes del {deadline}.',\n ru:'Несколько месяцев назад вы приняли участие в мероприятии «{title}», которое {dates} провела организация {org} — {centre}, в рамках Виртуальной лаборатории ВМО–КГМС по образованию и подготовке кадров в области спутниковой метеорологии.\\n\\nЗаполнение анкеты занимает около 9 минут, и в ней задаётся один вопрос: что вам удалось сделать с полученными знаниями. Отрицательные ответы для нас так же полезны, как и положительные: если применить ничего не удалось, нам важно знать, что этому помешало.\\n\\nОтветы конфиденциальны и представляются только в обобщённом виде. Ответы принимаются до {deadline}.',\n zh:'数月前，您参加了由 {org} — {centre} 于 {dates} 举办的培训活动《{title}》，该活动属于世界气象组织–气象卫星协调组卫星气象教育与培训虚拟实验室（WMO–CGMS VLab）的活动。\\n\\n本问卷约需 9 分钟，只问一件事：您把所学内容用到了哪里。否定的回答与肯定的回答同样有价值——如果没有机会应用，我们需要了解是什么造成了阻碍。\\n\\n回答均予保密，且仅以汇总形式呈现。请于 {deadline} 前作答。',\n ar:'قبل عدة أشهر شاركت في النشاط التدريبي «{title}»، الذي نظّمته {org} — {centre} {dates}، في إطار المختبر الافتراضي WMO–CGMS للتعليم والتدريب في مجال الأرصاد الجوية الساتلية.\\n\\nيستغرق هذا الاستبيان نحو 9 دقائق ويسأل عن أمر واحد: ما تمكّنت من فعله بما تعلّمته. والإجابات السلبية مفيدة لنا بقدر الإيجابية — فإن لم يُطبَّق شيء، نحتاج أن نعرف ما الذي حال دون ذلك.\\n\\nتُعامَل الإجابات بسرية ولا تُعرض إلا بصورة مجمّعة. نرجو الرد قبل {deadline}.',\n pt:'Há alguns meses você participou da atividade “{title}”, realizado {dates} por {org} — {centre}, no âmbito do Laboratório Virtual OMM–CGMS para Educação e Formação em Meteorologia por Satélite.\\n\\nEste questionário leva cerca de 9 minutos e pergunta uma única coisa: o que você conseguiu fazer com o que aprendeu. Respostas negativas são tão úteis quanto as positivas — se nada foi aplicado, precisamos saber o que atrapalhou.\\n\\nAs respostas são confidenciais e divulgadas apenas de forma agregada. Pedimos que responda até {deadline}.'\n};\n\nconst FU_TITLE = {\n en:'Impact evaluation: {title}',\n fr:'Évaluation de l’impact : {title}',\n es:'Evaluación del impacto: {title}',\n ru:'Оценка воздействия: {title}',\n zh:'成效评估：{title}',\n ar:'تقييم الأثر: {title}',\n pt:'Avaliação de impacto: {title}'\n};\n\nconst FU_THANKS = {\n en:'Thank you. This is the information that lets the VLab network show that training changed practice, and not merely that it was well received.',\n fr:'Merci. Ce sont ces réponses qui permettent au réseau du Laboratoire virtuel de montrer que l’activité a changé les pratiques, et pas seulement qu’elle a été bien accueillie.',\n es:'Gracias. Esta es la información que permite a la red del Laboratorio Virtual mostrar que la actividad cambió la práctica, y no solo que fue bien recibida.',\n ru:'Спасибо! Именно эти ответы позволяют сети Виртуальной лаборатории показать, что мероприятие изменило практику, а не только понравилось участникам.',\n zh:'感谢您。正是这些回答使虚拟实验室网络能够表明本次活动确实改变了实际工作，而不只是获得了好评。',\n ar:'شكرًا لك. هذه هي المعلومات التي تتيح لشبكة المختبر الافتراضي أن تُبيّن أن النشاط غيّر الممارسة فعلًا، لا أنه لقي استحسانًا فحسب.',\n pt:'Agradecemos. Esta é a informação que permite à rede VLab mostrar que a atividade mudou a prática, e não apenas que foi bem recebida.'\n};\n\nconst PARTNER_LINE = {\n en:'in partnership with {partners}',\n fr:'en partenariat avec {partners}',\n es:'en asociación con {partners}',\n ru:'в партнёрстве с {partners}',\n zh:'与 {partners} 合作举办',\n ar:'بالشراكة مع {partners}',\n pt:'em parceria com {partners}'\n};\nconst RTL = { ar:1 };\n\n// Recommended header-image sizes per tool. All 4:1 except Typeform (3:1),\n// so the 1600x400 layout scales cleanly by a single factor.\nconst BANNER_SIZES = {\n  googleforms:{w:1600,h:400}, msforms:{w:1128,h:282}, surveymonkey:{w:1200,h:300},\n  limesurvey:{w:1200,h:300}, typeform:{w:1500,h:500}, generic:{w:1600,h:400}\n};\n\nconst FU = {\"en\":{\"secs\":[\"1. Your situation since the course\",\"2. What you have used\",\"3. What has changed in practice\",\"4. Passing it on\",\"5. What has stood in the way\",\"6. What would help you now\",\"7. A short conversation\",\"8. How to reach you\"],\"secHelp\":[\"Three quick questions so we can read the results by role and context.\",\"The abilities below are the ones the activity set out to build.\",\"This is the most valuable question in the survey. A specific example, however modest, tells us more than any rating.\",\"The first question is required; the two that follow are optional.\",\"Please answer candidly. Identifying the obstacles is how the next activity gets better, and nothing is attributed to anyone.\",\"\",\"Entirely optional, and a decline costs nothing.\",\"\"],\"qs\":[{\"id\":\"q1\",\"sec\":0,\"t\":\"What type of organization do you work for?\",\"help\":\"\",\"ty\":\"single\",\"req\":true,\"contact\":false,\"o\":[\"A national meteorological or hydrological service\",\"An environmental agency (federal, state or municipal)\",\"Civil protection, fire service or emergency response\",\"A university or research institute\",\"A private-sector company\", mento\",\"5. O que atrapalhou\",\"6. O que ajudaria você agora\",\"7. Uma conversa curta\",\"8. Como falar com você\"],\"secHelp\":[\"Três perguntas rápidas, para que possamos ler os resultados por função e contexto.\",\"As capacidades abaixo são as que a atividade se propôs a desenvolver.\",\"Esta é a pergunta mais valiosa do questionário. Um exemplo específico, por modesto que seja, diz mais do que qualquer nota.\",\"A primeira pergunta é obrigatória; as duas seguintes são opcionais.\",\"Responda com sinceridade. Identificar os obstáculos é o que melhora a próxima atividade, e nenhuma resposta é atribuída a quem a deu.\",\"\",\"Totalmente opcional, e recusar não custa nada.\",\"\"],\"qs\":[{\"id\":\"q1\",\"sec\":0,\"t\":\"Em que tipo de organização você trabalha?\",\"help\":\"\",\"ty\":\"single\",\"req\":true,\"contact\":false,\"o\":[\"Serviço meteorológico ou hidrológico nacional\",\"Órgão ambiental (federal, estadual ou municipal)\",\"Defesa Civil, Corpo de Bombeiros ou resposta a emergências\",\"Universidade ou instituto de pesquisa\",\"Empresa do setor privado\",\"Sou estudante\"],\"r\":null,\"br\":null,\"n\":1},{\"id\":\"q2\",\"sec\":0,\"t\":\"Com que frequência {subject} aparece no seu trabalho?\",\"help\":\"\",\"ty\":\"single\",\"req\":true,\"contact\":false,\"o\":[\"Diariamente\",\"Semanalmente\",\"Mensalmente\",\"Ocasionalmente, algumas vezes por ano\",\"Ainda não, mas espero que isso mude\",\"Isso não faz parte do meu trabalho\"],\"r\":null,\"br\":null,\"n\":2},{\"id\":\"q3\",\"sec\":0,\"t\":\"Desde a atividade, você teve oportunidade de usar algo do que aprendeu?\",\"help\":\"Se a resposta sincera for não, diga isso — essa constatação importa tanto quanto qualquer história de sucesso.\",\"ty\":\"single\",\"req\":true,\"contact\":false,\"o\":[\"Sim, usei pelo menos parte do conteúdo\",\"Ainda não, mas espero usar em breve\",\"Não, e não espero usar\"],\"r\":null,\"br\":[{\"t\":\"Sim, usei pelo menos parte do conteúdo\",\"dest\":\"2. O que você utilizou\" atif, et un refus ne coûte rien.\",\"\"],\"qs\":[{\"id\":\"q1\",\"sec\":0,\"t\":\"Dans quel type d’organisation travaillez-vous ?\",\"help\":\"\",\"ty\":\"single\",\"req\":true,\"contact\":false,\"o\":[\"Un service météorologique ou hydrologique national\",\"Un organisme environnemental (national, régional ou municipal)\",\"Protection civile, service d’incendie ou secours d’urgence\",\"Une université ou un institut de recherche\",\"Une entreprise du secteur privé\",\"Je poursuis des études\"],\"r\":null,\"br\":null,\"n\":1},{\"id\":\"q2\",\"sec\":0,\"t\":\"À quelle fréquence rencontrez-vous {subject} dans votre travail ?\",\"help\":\"\",\"ty\":\"single\",\"req\":true,\"contact\":false,\"o\":[\"Quotidiennement\",\"Chaque semaine\",\"Chaque mois\",\"Occasionnellement, quelques fois par an\",\"Pas encore, mais je m’y attends\",\"Cela n’intervient pas dans mon travail\"],\"r\":null,\"br\":null,\"n\":2},{\"id\":\"q3\",\"sec\":0,\"t\":\"Depuis l’activité, avez-vous eu l’occasion d’utiliser une partie de ce que vous avez appris ?\",\"help\":\"Si la réponse honnête est non, dites-le — ce constat compte autant que n’importe quelle réussite.\",\"ty\":\"single\",\"req\":true,\"contact\":false,\"o\":[\"Oui, j’en ai utilisé au moins une partie\",\"Pas encore, mais je pense le faire bientôt\",\"Non, et je ne pense pas le faire\"],\"r\":null,\"br\":[{\"t\":\"Oui, j’en ai utilisé au moins une partie\",\"dest\":\"2. Ce que vous avez utilisé\"},{\"t\":\"Pas encore, mais je pense le faire bientôt\",\"dest\":\"5. Ce qui a fait obstacle\"},{\"t\":\"Non, et je ne pense pas le faire\",\"dest\":\"5. Ce qui a fait obstacle\"}],\"n\":3},{\"id\":\"q4\",\"sec\":1,\"t\":\"Depuis l’activité, à quelle fréquence avez-vous appliqué chacun des éléments suivants ?\",\"help\":\"\",\"ty\":\"grid\",\"req\":true,\"contact\":false,\"o\":[\"Aucune occasion de l’appliquer\",\"Essayé, mais sans succès pour l’instant\",\"Appliqué une ou deux fois\",\"Appliqué occasionnellement\",\"Appliqué régulièrement\"],\"  ?\",\"help\":\"\",\"ty\":\"grid\",\"req\":true,\"contact\":false,\"o\":[\"Pas un obstacle\",\"Un obstacle mineur\",\"Un obstacle modéré\",\"Un obstacle majeur\"],\"r\":[\"Pas de temps — les tâches opérationnelles ne laissent aucune marge\",\"Aucune tâche ou projet adapté ne s’est présenté\",\"Il me faudrait plus de pratique ou d’accompagnement pour le faire avec assurance\",\"Obstacles techniques : ressources informatiques, logiciels ou accès aux données\",\"J’ai oublié une partie de ce qui a été enseigné\",\"Ce n’est pas une priorité pour mon organisation\",\"Mon supérieur ou mon institution ne l’a pas soutenu\"],\"br\":null,\"n\":12},{\"id\":\"q13\",\"sec\":4,\"t\":\"Et combien chacun des éléments suivants vous a-t-il aidé à l’appliquer ?\",\"help\":\"\",\"ty\":\"grid\",\"req\":false,\"contact\":false,\"o\":[\"Pas disponible pour moi\",\"A un peu aidé\",\"A considérablement aidé\",\"A énormément aidé\"],\"r\":[\"Les carnets et supports de l’activité, auxquels je peux revenir\",\"Les enregistrements sur la chaîne YouTube du Laboratoire virtuel\",\"Le soutien ou l’intérêt de mon supérieur\",\"Des collègues travaillant sur les mêmes questions\",\"Disposer de données locales réelles sur lesquelles travailler\",\"Ma propre détermination à l’utiliser\"],\"br\":null,\"n\":13},{\"id\":\"q14\",\"sec\":5,\"t\":\"Quel soutien ferait la plus grande différence pour vous au cours des six prochains mois ?\",\"help\":\"Trois choix au maximum.\",\"ty\":\"multi\",\"req\":true,\"contact\":false,\"o\":[\"Une courte session de remise à niveau sur le contenu\",\"Une formation plus avancée pour aller plus loin\",\"Un guide écrit, étape par étape, des principaux enchaînements de traitement\",\"Des exemples traités avec des données de ma propre région\",\"Un canal pour poser des questions techniques aux formateurs\",\"Une communauté de pratique avec les autres participants\",\"De l’aide pour convaincre mon institution de donner la priorité à ce travail\",\"Rien de plus — j’ai ce qu’il me faut\"],\"r\":null,\"br\":null,\"n\":14},{\"id\":\"q15\",\"sec\":5,\"t\":\"Souhaitez-vous nous dire autre chose ?\",\"help\":\"Facultatif. Des commentaires sur l’activité, sur son utilité quelques mois plus tard, ou sur ce qui vous aiderait par la suite.\",\"ty\":\"long\",\"req\":false,\"contact\":false,\"o\":null,\"r\":null,\"br\":null,\"n\":15},{\"id\":\"q16\",\"sec\":6,\"t\":\"Accepteriez-vous de nous parler pendant 20 à 30 minutes de votre expérience ?\",\"help\":\"Nous souhaitons comprendre en profondeur un petit nombre de cas — aussi bien ceux où l’activité a bien fonctionné que ceux où elle n’a pas fonctionné. Ces échanges façonnent l’activité suivante plus que n’importe quelle statistique.\",\"ty\":\"single\",\"req\":true,\"contact\":false,\"o\":[\"Oui, j’accepte\",\"Non, merci\"],\"r\":null,\"br\":[{\"t\":\"Oui, j’accepte\",\"dest\":\"8. Comment vous joindre\"},{\"t\":\"Non, merci\",\"dest\":\"__SUBMIT__\"}],\"n\":16},{\"id\":\"cc16\",\"sec\":7,\"t\":\"Votre nom\",\"help\":\"\",\"ty\":\"short\",\"req\":true,\"contact\":true,\"o\":null,\"r\":null,\"br\":null,\"n\":null},{\"id\":\"cc17\",\"sec\":7,\"t\":\"Votre adresse électronique\",\"help\":\"Veuillez saisir une adresse électronique valide.\",\"ty\":\"email\",\"req\":true,\"contact\":true,\"o\":null,\"r\":null,\"br\":null,\"n\":null}]},\"es\":{\"secs\":[\"1. Su situación desde la actividad\",\"2. Lo que ha utilizado\",\"3. Qué ha cambiado en la práctica\",\"4. Cómo lo ha compartido\",\"5. Lo que lo ha impedido\",\"6. Lo que le ayudaría ahora\",\"7. Una breve conversación\",\"8. Cómo ponernos en contacto\"],\"secHelp\":[\"Tres preguntas rápidas, para poder leer los resultados por función y contexto.\",\"Las capacidades que figuran a continuación son las que la actividad pretendía desarrollar.\",\"Es la pregunta más valiosa de la encuesta. Un ejemplo concreto, por modesto que sea, dice más que cualquier puntuación.\",\"La primera pregunta es obligatoria; las dos siguientes son opcionales.\",\"Responda con franqueza. Identificar los obstáculos es lo que nos permite mejorar la próxima actividad, y no atribuiremos nada a nadie.\",\"\",\"Enteramente opcional, y declinar no cuesta nada.\",\"\"],\"qs\":[{\"id\":\"q1\",\"sec\":0,\"t\":\"¿En qué tipo de organización trabaja?\",\"help\":\"\",\"ty\":\"single\",\"req\":true,\"contact\":false,\"o\":[\"Un servicio meteorológico o hidrológico nacional\",\"Un organismo ambiental (nacional, regional o municipal)\",\"Protección civil, bomberos o respuesta a emergencias\",\"Una universidad o instituto de investigación\",\"Una empresa del sector privado\",\"Soy estudiante\"],\"r\":null,\"br\":null,\"n\":1},{\"id\":\"q2\",\"sec\":0,\"t\":\"¿Con qué frecuencia {subject} interviene en su trabajo?\",\"help\":\"\",\"ty\":\"single\",\"req\":true,\"contact\":false,\"o\":[\"A diario\",\"Semanalmente\",\"Mensualmente\",\"Ocasionalmente, unas pocas veces al año\",\"Todavía no, pero espero que lo haga\",\"No interviene en mi trabajo\"],\"r\":null,\"br\":null,\"n\":2},{\"id\":\"q3\",\"sec\":0,\"t\":\"Desde la actividad, ¿ha tenido oportunidad de utilizar algo de lo aprendido?\",\"help\":\"Si la respuesta sincera es no, dígalo: esa constatación importa tanto como cualquier caso de éxito.\",\"ty\":\"single\",\"req\":true,\"contact\":false,\"o\":[\"Sí, he utilizado al menos parte\",\"Todavía no, pero espero hacerlo pronto\",\"No, y no espero hacerlo\"],\"r\":null,\"br\":[{\"t\":\"Sí, he utilizado al menos parte\",\"dest\":\"2. Lo que ha utilizado\"},{\"t\":\"Todavía no, pero espero hacerlo pronto\",\"dest\":\"5. Lo que lo ha impedido\"},{\"t\":\"No, y no espero hacerlo\",\"dest\":\"5. Lo que lo ha impedido\"}],\"n\":3},{\"id\":\"q4\",\"sec\":1,\"t\":\"Desde la actividad, ¿con qué frecuencia ha aplicado cada una de las siguientes capacidades?\",\"help\":\"\",\"ty\":\"grid\",\"req\":true,\"contact\":false,\"o\":[\"Sin oportunidad de aplicarlo\",\"Lo intenté, pero aún sin éxito\",\"Lo apliqué una o dos veces\",\"Lo apliqué ocasionalmente\",\"Lo apliqué co  защита, пожарная служба или экстренное реагирование\",\"Университет или научно-исследовательский институт\",\"Компания частного сектора\",\"Учусь\"],\"r\":null,\"br\":null,\"n\":1},{\"id\":\"q2\",\"sec\":0,\"t\":\"Насколько часто {subject} встречается в вашей работе?\",\"help\":\"\",\"ty\":\"single\",\"req\":true,\"contact\":false,\"o\":[\"Ежедневно\",\"Каждую неделю\",\"Каждый месяц\",\"Изредка, несколько раз в год\",\"Пока нет, но я этого ожидаю\",\"В моей работе это не встречается\"],\"r\":null,\"br\":null,\"n\":2},{\"id\":\"q3\",\"sec\":0,\"t\":\"Была ли у вас после мероприятия возможность применить что-то из изученного?\",\"help\":\"Если честный ответ — нет, так и напишите: этот вывод важен не меньше любой истории успеха.\",\"ty\":\"single\",\"req\":true,\"contact\":false,\"o\":[\"Да, хотя бы частично\",\"Пока нет, но рассчитываю в ближайшее время\",\"Нет, и не рассчитываю\"],\"r\":null,\"br\":[{\"t\":\"Да, хотя бы частично\",\"dest\":\"2. Что вы применяли\"},{\"t\":\"Пока нет, но рассчитываю в ближайшее время\",\"dest\":\"5. Что мешало\"},{\"t\":\"Нет, и не рассчитываю\",\"dest\":\"5. Что мешало\"}],\"n\":3},{\"id\":\"q4\",\"sec\":1,\"t\":\"Как часто после мероприятия вы применяли каждый из этих навыков?\",\"help\":\"\",\"ty\":\"grid\",\"req\":true,\"contact\":false,\"o\":[\"Возможности применить не было\",\"Пробовали, но пока не получилось\",\"Один-два раза\",\"Изредка\",\"Регулярно\"],\"r\":null,\"br\":null,\"n\":4},{\"id\":\"q5\",\"sec\":1,\"t\":\"Насколько уверенно вы сейчас работаете с этими методами самостоятельно?\",\"help\":\"\",\"ty\":\"single\",\"req\":true,\"contact\":false,\"o\":[\"Увереннее, чем в конце мероприятия\",\"Примерно так же, как в конце мероприятия\",\"Менее уверенно — часть уже забылась\",\"Применяли слишком мало, чтобы судить\"],\"r\":null,\"br\":null,\"n\":5},{\"id\":\"q6\",\"sec\":2,\"t\":\"Расскажите об одной конкретной задаче, которую вы решили с помощью изученного, и что из этого получилось.\",\"help\":\"Необязательно, но это самое полезное поле во всей анкете. Например: карта или продукт, который вы подготовили; анализ, который вы провели; отчёт или бюллетень, в который вы внесли вклад; решение, принятое с опорой на эту работу; скрипт, который вы адаптировали под свой регион. Хватит двух предложений: что вы сделали, для кого и что это изменило. Если рассказать пока не о чем, оставьте поле пустым.\",\"ty\":\"long\",\"req\":false,\"contact\":false,\"o\":null,\"r\":null,\"br\":null,\"n\":6},{\"id\":\"q7\",\"sec\":2,\"t\":\"Изменилось ли что-то в работе вас или вашей команды после мероприятия?\",\"help\":\"Отметьте всё подходящее.\",\"ty\":\"multi\",\"req\":true,\"contact\":false,\"o\":[\"Я работаю с источником данных, которого прежде не было в моей практике\",\"Я делаю что-то быстрее или проще, чем раньше\",\"Я готовлю карты, схемы или продукты, которые прежде были мне недоступны\",\"Задача, которая раньше делалась вручную, теперь автоматизирована\",\"Я тщательнее, чем прежде, оцениваю достоверность данных\",\"Я участвую в подготовке отчётов, бюллетеней или справок с использованием этих методов\",\"Решение или оперативные действия опирались на работу, выполненную этими методами\",\"В нашей работе ничего не изменилось\"],\"r\":null,\"br\":null,\"n\":7},{\"id\":\"q8\",\"sec\":2,\"t\":\"Насколько мероприятие помогло каждому из перечисленного?\",\"help\":\"\",\"ty\":\"grid\",\"req\":false,\"contact\":false,\"o\":[\"Никак не помогло\",\"Помогло незначительно\",\"Помогло умеренно\",\"Помогло существенно\",\"Слишком рано судить\"],\"r\":[\"Я работаю эффективнее над задачами, которым было посвящено мероприятие\",\"Моя организация выпускает новый продукт или услугу\",\"Существующий продукт или услуга стали лучше\",\"Информация доходит до принимающих решения лучше, чем раньше\"],\"br\":null,\"n\":8},{\"id\":\"q9\",\"sec\":3,\"t\":\"Рассказывали ли вы коллегам о том, чему научились?\",\"help\":\"\",\"ty\":\"single\",\"req\":true,\"contact\":false,\"o\":[\"Да\",\"Пока нет, но планирую\",\"Нет\"],\"r\":n eSurvey  and authorize the access request.\\n *  6. WHERE THE LINK APPEARS. Three places, so you cannot miss it:\\n *       - emailed to you, as a clickable button (unless you switch that off);\\n *       - printed in the execution log — press Ctrl+Enter to open that panel;\\n *       - and the form itself is now in your Google Drive, named after the\\n *         course, so you can also just open drive.google.com and find it.\\n *  7. From that point you work entirely in the normal Google Forms interface.\\n *     You do not need to come back to Apps Script to edit or add questions —\\n *     the script only builds the first version for you.\\n *\\n *  RULES OF ADAPTATION\\n *  - Do NOT change the wording of anything marked [CORE]. Those questions are\\n *    what make results comparable across the VLab network.\\n *  - DO adapt anything marked [ADAPT] to your own course.\\n *  - DO switch [OPTIONAL] modules on or off to suit your delivery format.\\n *  - Keep the total near 20 questions. The core and recommended set is already\\n *    17, so three modules is the practical ceiling. Every question you add\\n *    costs you completion rate.\\n *  - The description tells participants \\\"about 6 minutes\\\", which is right for\\n *    17 questions. If you enable more than three modules, raise that figure in\\n *    STRINGS.descBurden. Understating the burden costs you completion rate.\\n *\\n *  Respondent burden: 17 questions with no module enabled, about 6 minutes.\\n *  All eight modules enabled gives 27 questions, about 9 minutes. Enabling no\\n *  more than three keeps it near 20 questions and 7 minutes.\\n * ============================================================================\\n */\\n\\n/* ══════════════════════════════════════════════════════════════════════════\\n   CONFIG — edit this block, and nothing below it\\n   ══════════════════════════════════════════════════════════════════════════ */\\n\\nvar CONFIG = {\\n\\n  // ---- Identity of the activity -------------------------------------------\\n  courseTitle:      'INSERT COURSE TITLE HERE',\\n  organizer:        'INSERT LEAD INSTITUTION HERE',\\n  partners:         'INSERT PARTNER INSTITUTIONS HERE',   // '' if none\\n  centreOfExcellence: 'INSERT CENTRE OF EXCELLENCE NAME HERE',\\n  dates:            'INSERT DATES HERE',                  // e.g. '3 to 5 March 2027'\\n  deadline:         'INSERT RESPONSE DEADLINE HERE',      // e.g. '20 March 2027'\\n  followUpMonth:    'INSERT FOLLOW-UP MONTH HERE',        // e.g. 'June 2027'\\n\\n  // ---- Delivery of the links ---------------------------------------------\\n  // true emails the edit link and the participant link to whoever runs the\\n  // script, so they arrive somewhere clickable. Set false to use only the log.\\n  emailLinksToMe: true,\\n\\n  // ---- Language -----------------------------------------------------------\\n  // 'en' or 'pt'. To run the survey in another language, translate the STRINGS\\n  // block near the end of this file and add your language code there.\\n  language: 'en',\\n\\n  // ---- Competencies measured before and after [ADAPT] --------------------\\n  // THIS IS THE MOST IMPORTANT THING YOU WILL EDIT.\\n  // Write the concrete, observable abilities your course was meant to build.\\n  // Use verbs the participant can picture themselves doing. Keep to four.\\n  // Good:  'Retrieve and plot a time series of sea surface temperature'\\n  // Poor:  'Understand oceanography'\\n  competencies: [\\n    'INSERT COMPETENCY 1 — a concrete thing they can now do',\\n    'INSERT COMPETENCY 2',\\n    'INSERT COMPETENCY 3',\\n    'INSERT COMPETENCY 4'\\n  ],\\n\\n  // ---- What the participants rated [ADAPT] -------------------------------\\n  // Remove any line that did not feature in your activity.\\n  components: [\\n    'The instructors\\\\u2019 explanations',\\n    'The live demonstrations',\\n    'The hands-on exercises',\\n    'The supporting materials and documentation'\\n  ],\\n\\n  // ---- Future course topics [ADAPT] --------------------------------------\\n  // Replace with the themes your Centre could realistically offer. This\\n  // question is your demand signal for the next planning cycle, so make the\\n  // options things you would actually consider running.\\n  futureTopics: [\\n    'INSERT CANDIDATE TOPIC 1',\\n    'INSERT CANDIDATE TOPIC 2',\\n    'INSERT CANDIDATE TOPIC 3',\\n    'INSERT CANDIDATE TOPIC 4',\\n    'INSERT CANDIDATE TOPIC 5',\\n    'INSERT CANDIDATE TOPIC 6'\\n  ],\\n\\n  // ---- Session or topic list, used only by MODULES.difficulty [ADAPT] ----\\n  sessions: [\\n    'INSERT SESSION OR TOPIC 1',\\n    'INSERT SESSION OR TOPIC 2',\\n    'INSERT SESSION OR TOPIC 3',\\n    'INSERT SESSION OR TOPIC 4'\\n  ],\\n\\n  // ---- Practical environments, used only by MODULES.practical [ADAPT] ----\\n  // e.g. ['Python notebooks in Google Colab', 'Google Earth Engine']\\n  practicalEnvironments: [\\n    'INSERT PRACTICAL ENVIRONMENT 1',\\n    'INSERT PRACTICAL ENVIRONMENT 2'\\n  ]\\n};\\n\\n/* ══════════════════════════════════════════════════════════════════════════\\n   MODULES — switch optional blocks on or off\\n   Turn on only what applies to your activity. Each one costs response rate.\\n   ══════════════════════════════════════════════════════════════════════════ */\\n\\nvar MODULES = {\\n  practical:    true,   // hands-on exercises: completion by environment, blockers\\n  multiDay:     true,   // multi-session activity: attendance pattern and attrition\\n  difficulty:   true,   // which topic was hardest — pairs well with quiz analysis\\n  platform:     false,  // usefulness of the interaction channels used\\n  assessment:   false,  // quizzes and certification experience\\n  accessibility:false,  // language, time zone, bandwidth barriers\\n  asyncFormat:  false,  // self-paced or blended delivery\\n  institutional:false    // supervisor support and onward sharing\\n};\\n\\n/* ══════════════════════════════════════════════════════════════════════════\\n   BUILDER — no need to edit below this line\\n   ══════════════════════════════════════════════════════════════════════════ */\\n\\nfunction createSurvey() {\\n  var S = STRINGS[CONFIG.language] || STRINGS.en;\\n  var C = CONFIG;\\n\\n  _warnIfPlaceholdersRemain();\\n\\n  var form = FormApp.create(S.formTitle.replace(/\\{course\\}/g, C.courseTitle));\\n  form.setDescription(_buildDescription(S, C));\\n  form.setCollectEmail(false);\\n  form.setProgressBar(true);\\n  form.setAllowResponseEdits(true);\\n  form.setConfirmationMessage(\\n    S.thanks\\n  );\\n\\n  // ── SECTION 1 · Respondent profile [CORE] ────────────────────────────────\\n  // Placed first, deliberately. This is the data most often missing from\\n  // training reports, and completion declines towards the end of any survey.\\n  form.addPageBreakItem().setTitle(S.s1Title).setHelpText(S.s1Help);\\n\\n  form.addListItem()\\n    .setTitle(S.qCountry)\\n    .setChoiceValues(S.countries)\\n    .setRequired(true);\\n\\n  form.addMultipleChoiceItem()\\n    .setTitle(S.qOrgType)\\n    .setChoiceValues(S.orgTypes)\\n    .showOtherOption(true)\\n    .setRequired(true);\\n\\n  form.addMultipleChoiceItem()\\n    .setTitle(S.qExperience)\\n    .setChoiceValues(S.experienceBands)\\n    .setRequired(true);\\n\\n  // ── SECTION 2 · Overall assessment [CORE] ────────────────────────────────\\n  form.addPageBreakItem().setTitle(S.s2Title);\\n\\n  form.addMultipleChoiceItem()\\n    .setTitle(S.qOverall)\\n    .setChoiceValues(S.overallScale)\\n    .setRequired(true);\\n\\n  form.addScaleItem()\\n    .setTitle(S.qRecommend)\\n    .setBounds(0, 10)\\n    .setLabels(S.npsLow, S.npsHigh)\\n    .setRequired(true);\\n\\n  form.addGridItem()\\n    .setTitle(S.qAgreement)\\n    .setRows(S.agreementRows)\\n    .setColumns(S.agreementCols)\\n    .setRequired(true);\\n\\n  // ── SECTION 3 · Delivery quality [RECOMMENDED, ADAPT] ────────────────────\\n  form.addPageBreakItem().setTitle(S.s3Title);\\n\\n  form.addGridItem()\\n    .setTitle(S.qComponents)\\n    .setRows(C.components)\\n    .setColumns(S.qualityCols)\\n    .setRequired(true);\\n\\n  form.addMultipleChoiceItem()\\n    .setTitle(S.qPace)\\n    .setChoiceValues(S.paceScale)\\n    .setRequired(true);\\n\\n  // ── MODULE · Hands-on exercises [OPTIONAL] ───────────────────────────────\\n  if (MODULES.practical) {\\n    form.addGridItem()\\n      .setTitle(S.qPracticalDone)\\n      .setRows(C.practicalEnvironments)\\n      .setColumns(S.practicalCols)\\n      .setRequired(true);\\n\\n    form.addMultipleChoiceItem()\\n      .setTitle(S.qPracticalHelp)\\n      .setChoiceValues(S.practicalHelpOptions)\\n      .showOtherOption(true)\\n      .setRequired(false);\\n  }\\n\\n  // ── MODULE · Multi-day attendance [OPTIONAL] ─────────────────────────────\\n  if (MODULES.multiDay) {\\n    form.addMultipleChoiceItem()\\n      .setTitle(S.qAttendance)\\n      .setChoiceValues(S.attendanceOptions)\\n      .setRequired(true);\\n\\n    form.addCheckboxItem()\\n      .setTitle(S.qAttritionReasons)\\n      .setHelpText(S.selectUpToThree)\\n      .setChoiceValues(S.attritionOptions)\\n      .showOtherOption(true)\\n      .setRequired(false);\\n  }\\n\\n  // ── MODULE · Platform and channels [OPTIONAL] ────────────────────────────\\n  if (MODULES.platform) {\\n    form.addGridItem()\\n      .setTitle(S.qChannels)\\n      .setRows(S.channelRows)\\n      .setColumns(S.channelCols)\\n      .setRequired(false);\\n  }\\n\\n  // ── MODULE · Accessibility [OPTIONAL] ────────────────────────────────────\\n  if (MODULES.accessibility) {\\n    form.addCheckboxItem()\\n      .setTitle(S.qBarriers)\\n      .setChoiceValues(S.barrierOptions)\\n      .showOtherOption(true)\\n      .setRequired(false);\\n  }\\n\\n  // ── MODULE · Asynchronous or blended delivery [OPTIONAL] ─────────────────\\n  if (MODULES.asyncFormat) {\\n    form.addMultipleChoiceItem()\\n      .setTitle(S.qAsyncBalance)\\n      .setChoiceValues(S.asyncBalanceOptions)\\n      .setRequired(false);\\n  }\\n\\n  // ── SECTION 4 · Learning [CORE] ──────────────────────────────────────────\\n  // Retrospective before-and-after. Asking both at the same moment avoids the\\n  // response-shift bias that distorts true pre-course questionnaires, and\\n  // removes the need for a second instrument entirely.\\n  form.addPageBreakItem().setTitle(S.s4Title).setHelpText(S.s4Help);\\n\\n  form.addGridItem()\\n    .setTitle(S.qAbilityBefore)\\n    .setRows(C.competencies)\\n    .setColumns(S.abilityCols)\\n    .setRequired(true);\\n\\n  form.addGridItem()\\n    .setTitle(S.qAbilityAfter)\\n    .setRows(C.competencies)\\n    .setColumns(S.abilityCols)\\n    .setRequired(true);\\n\\n  form.addMultipleChoiceItem()\\n    .setTitle(S.qConfidence)\\n    .setChoiceValues(S.confidenceScale)\\n    .setRequired(true);\\n\\n  if (MODULES.difficulty) {\\n    var diff = C.sessions.slice();\\n    diff.push(S.noneWasDifficult);\\n    form.addMultipleChoiceItem()\\n      .setTitle(S.qHardest)\\n      .setChoiceValues(diff)\\n      .showOtherOption(true)\\n      .setRequired(false);\\n  }\\n\\n  // ── MODULE · Assessment and certification [OPTIONAL] ─────────────────────\\n  if (MODULES.assessment) {\\n    form.addMultipleChoiceItem()\\n      .setTitle(S.qAssessmentFair)\\n      .setChoiceValues(S.agreementCols.slice(0, 5))\\n      .setRequired(false);\\n  }\\n\\n  // ── SECTION 5 · Application and open comment [CORE] ──────────────────────\\n  form.addPageBreakItem().setTitle(S.s5Title);\\n\\n  form.addMultipleChoiceItem()\\n    .setTitle(S.qApplyIntent)\\n    .setChoiceValues(S.intentScale)\\n    .setRequired(true);\\n\\n  if (MODULES.institutional) {\\n    form.addMultipleChoiceItem()\\n      .setTitle(S.qInstitutionalSupport)\\n      .setChoiceValues(S.institutionalOptions)\\n      .setRequired(false);\\n  }\\n\\n  form.addParagraphTextItem()\\n    .setTitle(S.qMostValuable)\\n    .setHelpText(S.openHelpValuable)\\n    .setRequired(false);\\n\\n  form.addParagraphTextItem()\\n    .setTitle(S.qOneChange)\\n    .setHelpText(S.openHelpChange)\\n    .setRequired(false);\\n\\n  form.addCheckboxItem()\\n    .setTitle(S.qFutureTopics)\\n    .setHelpText(S.selectUpToFive)\\n    .setChoiceValues(CONFIG.futureTopics)\\n    .showOtherOption(true)\\n    .setRequired(false);\\n\\n  // ── SECTION 6 · Follow-up consent [CORE] ─────────────────────────────────\\n  // This single question is what makes Kirkpatrick level 3 possible later.\\n  // Without it, no VLab activity can ever report whether training was applied.\\n  var s6 = form.addPageBreakItem().setTitle(S.s6Title);\\n\\n  var consent = form.addMultipleChoiceItem()\\n    .setTitle(S.qFollowUp)\\n    .setHelpText(S.followUpHelp.replace(/\\\\{month\\\\}/g, CONFIG.followUpMonth))\\n    .setRequired(true);\\n\\n  // ── SECTION 7 · Contact, shown only on consent [CORE] ────────────────────\\n  var s7 = form.addPageBreakItem()\\n    .setTitle(S.s7Title)\\n    .setHelpText(S.s7Help.replace(/\\\\{month\\\\}/g, CONFIG.followUpMonth));\\n\\n  form.addTextItem()\\n    .setTitle(S.qEmail)\\n    .setRequired(true)\\n    .setValidation(FormApp.createTextValidation()\\n      .setHelpText(S.emailInvalid)\\n      .requireTextIsEmail()\\n      .build());\\n\\n  // ── Branching, applied last so the target pages exist ────────────────────\\n  consent.setChoices([\\n    consent.createChoice(S.followUpYes, s7),\\n    consent.createChoice(S.followUpNo, FormApp.PageNavigationType.SUBMIT)\\n  ]);\\n\\n  var editUrl = form.getEditUrl();\\n  var liveUrl = form.getPublishedUrl();\\n\\n  // The form is now in your Google Drive. From here on you can work entirely\\n  // in the normal Google Forms interface — you never need to return to Apps\\n  // Script unless you want to rebuild from scratch.\\n  Logger.log('');\\n  Logger.log('════════════════════════════════════════════════════════════');\\n  Logger.log('  SURVEY CREATED');\\n  Logger.log('  ' + CONFIG.courseTitle);\\n  Logger.log('════════════════════════════════════════════════════════════');\\n  Logger.log('');\\n  Logger.log('  OPEN AND EDIT IN GOOGLE FORMS:');\\n  Logger.log('  ' + editUrl);\\n  Logger.log('');\\n  Logger.log('  SEND THIS ONE TO PARTICIPANTS:');\\n  Logger.log('  ' + liveUrl);\\n  Logger.log('');\\n  Logger.log('════════════════════════════════════════════════════════════');\\n  Logger.log('  The form is also in your Google Drive, named after the course.');\\n  Logger.log('  Before sending: complete it yourself, both branches of the');\\n  Logger.log('  last question; confirm Settings do not collect email or');\\n  Logger.log('  require a login; upload your header image under Customize theme.');\\n  Logger.log('════════════════════════════════════════════════════════════');\\n\\n  // Also email the links, so they arrive somewhere clickable rather than\\n  // only in the execution log. Set CONFIG.emailLinksToMe to false to skip.\\n  if (CONFIG.emailLinksToMe) {\\n    try {\\n      var me = Session.getEffectiveUser().getEmail();\\n      if (me) {\\n        MailApp.sendEmail({\\n          to: me,\\n          subject: 'Survey ready: ' + CONFIG.courseTitle,\\n          htmlBody:\\n            '<p style=\\\"font:15px/1.5 Arial,sans-serif\\\">Your evaluation survey has been created and is in your Google Drive.<\u002Fp>' +\\n            '<p style=\\\"font:15px/1.5 Arial,sans-serif\\\"><a href=\\\"' + editUrl + '\\\" ' +\\n            'style=\\\"display:inline-block;background:#005BAA;color:#fff;padding:12px 20px;' +\\n            'border-radius:5px;text-decoration:none;font-weight:bold\\\">Open and edit in Google Forms<\u002Fa><\u002Fp>' +\\n            '<p style=\\\"font:15px/1.5 Arial,sans-serif\\\">Link to send to participants:<br>' +\\n            '<a href=\\\"' + liveUrl + '\\\">' + liveUrl + '<\u002Fa><\u002Fp>' +\\n            '<p style=\\\"font:13px/1.5 Arial,sans-serif;color:#6B7280\\\">Before sending it: complete the form ' +\\n            'yourself, taking both branches of the final question; artners.replace(/\\{partners\\}/g, C.partners) + '$1'); }\\n  parts.push(opening);\\n  parts.push(S.descBurden);\\n  parts.push(S.descConfidentiality);\\n  parts.push(S.descCandour);\\n  parts.push(S.descDeadline.replace(/\\{deadline\\}/g, C.deadline));\\n  return parts.join('\\\\n\\\\n');\\n}\\n\\n/* ══════════════════════════════════════════════════════════════════════════\\n   STRINGS — the wording of the instrument\\n   Text marked [CORE] should not be reworded when adapting. To add a language,\\n   copy the whole 'en' block, translate it, and set CONFIG.language to match.\\n   ══════════════════════════════════════════════════════════════════════════ */\\n\\nvar STRINGS = {\\n\\n  en: {\\n    formTitle: 'Course evaluation: {course}',\\n\\n    descOpening: 'Thank you for taking part in the training course “{course}”, delivered {dates} by {organizer} — {centre}, under the WMO–CGMS Virtual Laboratory for Education and Training in Satellite Meteorology.',\\n    descPartners: 'in partnership with {partners}',\\n    descBurden: 'This questionnaire takes about 6 minutes. Your answers help us improve future training and allow us to report the reach and results of this activity to the WMO–CGMS VLab.',\\n    descConfidentiality: 'Responses are treated confidentially. Results are reported only in aggregate and no individual response is attributed. Giving your email address is optional and is used solely to send a short follow-up survey after an interval; it is never linked to your answers in any published result.',\\n    descCandour: 'There are no right or wrong answers — candid criticism is more useful to us than praise.',\\n    descDeadline: 'Please respond by {deadline}.',\\n    thanks: 'Thank you. Your evaluation directly shapes the planning of future VLab activities, and the main findings will be shared with participants.\\\\n\\\\n',\\n\\n    s1Title: '1. About you',\\n    s1Help: 'Three quick questions. They let us report participation accurately to WMO and the VLab
